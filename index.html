<script>
const D = {"cycleLabel": "Revisão de 13 out. 2026", "macro": [{"k": "Selic", "v": "13,75%"}, {"k": "CDI", "v": "13,65% a.a."}, {"k": "IPCA 12m", "v": "4,58%"}, {"k": "Focus Selic fim de 2026", "v": "13,25%"}, {"k": "NTN-B 2030", "v": "IPCA + 6,67%"}, {"k": "Dólar", "v": "R$ 5,01"}, {"k": "Ibovespa", "v": "206.888"}, {"k": "Ouro", "v": "US$ 4.179"}], "scale": [{"l": "A+", "min": 3.85}, {"l": "A", "min": 3.5}, {"l": "A−", "min": 3.15}, {"l": "B+", "min": 2.85}, {"l": "B", "min": 2.5}, {"l": "B−", "min": 2.15}, {"l": "C+", "min": 1.85}, {"l": "C", "min": 1.5}, {"l": "C−", "min": 1.15}, {"l": "D", "min": 0.7}], "pillars": [{"k": "p1", "s": "Tese", "n": "Aderência à tese", "w": 20, "q": "O índice é amplo e neutro, e o ETF cumpre o papel da classe na carteira de ETFs?", "a": "4 = índice amplo ponderado por mercado (ou soberano amplo) com papel claro; 3 = fatorial aceito pela tese ou papel parcialmente duplicado; 2 = concentração relevante ou papel redundante; 1 = temático; 0 = vetado pela tese."}, {"k": "p2", "s": "Fund.", "n": "Fundamentos do subjacente", "w": 20, "q": "Pelo preço de hoje (valuation, carrego, spread), o ativo de baixo remunera o risco frente ao CDI e ao papel que cumpre?", "a": "4 = carrego ou prêmio historicamente alto com risco controlado; 3 = remuneração acima da média; 2 = neutro ou caro com papel defensável; 1 = caro ou prêmio comprimido; 0 = remuneração negativa esperada."}, {"k": "p3", "s": "Custo", "n": "Custo efetivo e tributação", "w": 25, "q": "Quanto custa por ano, somando taxa e retenção na fonte, contra o ETF mais barato da B3 com o mesmo mandato e aberto a pessoa física? E qual a alíquota de IR do cotista?", "a": "Metade custo: 4 se é o mais barato da B3 no mandato, menos 1 ponto a cada 0,10 p.p. de custo efetivo acima dele. Metade IR: 15% vale 4, 20% vale 2, 25% vale 0. A faixa americana (0,10% para amplo) não entra: nenhum ETF da B3 chega lá."}, {"k": "p4", "s": "Veículo", "n": "Qualidade do veículo", "w": 15, "q": "Replicação, aderência ao índice, estrutura, documentação e histórico do emissor.", "a": "4 = replicação direta ou feeder único de emissor global, aderência ≈ taxa, documentos consistentes, 5+ anos; desconta por inconsistência documental, idade curta ou estrutura sintética."}, {"k": "p5", "s": "Escala", "n": "Escala e execução", "w": 10, "q": "Patrimônio e giro sustentam a taxa e permitem entrar e sair sem pedágio?", "a": "4 = PL ≥ R$ 1 bi e giro ≥ R$ 10 mi/dia; 3 = PL ≥ R$ 500 mi e giro ≥ R$ 3 mi; 2 = PL ≥ R$ 150 mi e giro ≥ R$ 1 mi; 1 = PL ≥ R$ 50 mi; 0 abaixo. Dado não confirmado em fonte primária vale no máximo 2."}, {"k": "p6", "s": "Estresse", "n": "Comportamento em estresse", "w": 10, "q": "Nas crises observadas e nos cenários do laboratório, o ETF faz o que o seu papel exige?", "a": "4 = protege ou se mantém quando a carteira mais precisa; 3 = cai menos que a classe ou tem cauda curta; 2 = cai com o mercado, cauda conhecida; 1 = cauda pior que a classe ou risco não testado na amostra; 0 = pode quebrar o papel."}], "thesisTests": [{"k": "t1", "n": "Amplo e neutro", "rule": "Índice amplo, ponderado por mercado. Fatorial só como exceção explícita (dividendos). Temático é vetado: é stock picking disfarçado de ETF picking.", "src": "Ata do Comitê de Alocação, 11/09/2026"}, {"k": "t2", "n": "Custo justo", "rule": "Ser o mais barato, ou quase, entre os ETFs da B3 com o mesmo mandato e abertos a pessoa física. As faixas da ata (0,10% para amplo, 0,30% para dividendos e crédito) vêm de ETFs listados nos EUA e não servem de régua na B3.", "src": "Atas de 04/09 e 11/09/2026, com régua da B3"}, {"k": "t3", "n": "Eficiência tributária", "rule": "Domicílio com retenção de até 15% sobre dividendos, acumulação, renda fixa na alíquota de 15% e diferimento do IR até o resgate.", "src": "Atas de 04/09 e 11/09/2026"}, {"k": "t4", "n": "Escala e liquidez", "rule": "Evitar ETF pequeno que não cobre a própria taxa; medir o spread real no home broker; preferir emissor consolidado.", "src": "Ata de 11/09/2026"}, {"k": "t5", "n": "Papel na alocação", "rule": "Cumprir a função da classe na carteira de ETFs. Ouro é seguro de carteira. A ata de 18/09 cita 50% Brasil e 50% dolarizado para a estratégia global inteira, contando cripto, que fica fora desta carteira.", "src": "Atas de 04/09, 18/09 e 25/09/2026"}, {"k": "t6", "n": "Cabe na trava de perda", "rule": "A contribuição ao risco precisa caber na perda máxima tolerada da carteira, da ordem de 30% em crise severa.", "src": "Ata de 11/09/2026"}], "disclaimer": "Documento de uso interno da Mercurius Capital. Não constitui recomendação de investimento. Dados de mercado até 13/10/2026; dados cadastrais em fonte primária (FNET, emissores, B3, ANBIMA, BCB) quando indicado. O rating é julgamento do analista sobre âncoras declaradas e deve ser contestado.", "summary": {"title": "Carteira Global de ETFs: revisão de outubro", "sub": "13 out. 2026 · 6 posições, 6 alternativas, 9 ETFs no radar, 77 no universo", "headline": "A seleção se sustenta; o ajuste que importa é trocar o pós-fixado pelo LFTB11", "scoreMeaning": "Só o LFTS11 falha um teste: o IR de 25%.", "lead": "A carteira passa na tese da casa na maior parte, e o que não passa tem nome: o imposto da perna pós-fixada, o tamanho ainda pequeno do VWRA11 e um crédito caro para o prêmio que paga. O rating olha três coisas ao mesmo tempo: o veículo, o preço do ativo de baixo e o imposto.", "sections": [{"h": "Os nossos ETFs passam na tese?", "html": "<p><b>Passam com folga:<\/b> B5P211 (A), GOLD11 (A) e DIVO11 (A−). O B5P211 é a melhor posição da carteira: juro real de IPCA + 6,5%, IR de 15% e R$ 4,5 bi de patrimônio.<\/p><p><b>Passam com ressalva:<\/b> VWRA11 (B+) e DEBB11 (B). O VWRA11 perdeu o posto de acesso mais barato: o MUND11, lançado em 30/09, faz o mesmo por 0,26% ao ano e ainda está pequeno. O DEBB11 tem prêmio apertado e, desde 21/09, o IR dos ETFs de crédito DI está em disputa (a XP suspendeu compras).<\/p><p><b>Falha no imposto:<\/b> LFTS11 (A−). Pelo carrego e pela liquidez é ótimo, mas paga <b>25% de IR<\/b> desde fevereiro de 2024. O LFTB11, da mesma gestora, cobra a mesma taxa e paga 15%.<\/p><p><b>Na carteira como um todo:<\/b> o rating ponderado pelos pesos da proposta é <b>B+ (3,12)<\/b>. A proposta tem 35% em ativos dolarizados e 65% em Brasil; a meta própria de dólar desta carteira de ETFs ainda não está escrita.<\/p>"}, {"h": "Onde está o problema", "html": "<p>A seleção está certa: em cinco das seis pernas, o ETF escolhido é a melhor opção da B3 para o mandato. As falhas vêm de dois lugares. A estrutura do mercado brasileiro: todo ETF de LFT paga 25% de IR. E a tese, que vive em atas de reunião e ainda não está escrita num documento único com regras de custo, imposto e meta de dólar.<\/p>"}, {"h": "O que fazer, em ordem", "html": "<ul><li><b>Migrar o núcleo pós-fixado para o LFTB11<\/b> (Smart Selic, mesma gestora e taxa, IR de 15%) por aportes novos; LFTS11 só para caixa. A diferença é de ~10 pontos do CDI por ano depois de imposto.<\/li><li><b>Suspender aportes no DEBB11<\/b> até a Receita definir se ETFs de crédito DI pagam 15% ou 25%.<\/li><li><b>Preparar a troca de VWRA11 por MUND11<\/b> por aportes novos, quando o MUND11 passar de R$ 150 mi.<\/li><li><b>Não trocar LFTS11 por BLFT11.<\/b> Mesmo IR, liquidez em bolsa incerta, ganho de 0,06–0,09 p.p.<\/li><li><b>Cancelar a entrada parcial no MARG11.<\/b> O regulamento só admite institucionais isentos.<\/li><li><b>Levar o B5P211 rumo ao 50/50 da renda fixa<\/b> que a tese descreve, via aportes.<\/li><li><b>Teto de 30% para crédito somado ao pós-fixado<\/b> enquanto o spread estiver abaixo da média de 12 meses.<\/li><li><b>Antes de 25/10:<\/b> confirmar que o rebalanceamento será só por aportes. No laboratório, uma reação adversa ao 2º turno é positiva para a carteira (+1,9%), porque ela é comprada em dólar.<\/li><li><b>Escrever a meta de exposição em dólar<\/b> da carteira de ETFs. A ata de 18/09 fala em 50/50 para a estratégia global, contando cripto.<\/li><li><b>Trocar a fonte de dados<\/b> dos ETFs de renda fixa: informe diário do FNET no lugar do Yahoo.<\/li><\/ul>"}, {"h": "A carteira aguenta?", "html": "<p>No laboratório de stress, a carteira proposta perde 10,6% num choque igual ao da covid e 7,8% no choque de juros globais de 2022. O ajuste sugerido nesta revisão (mais B5P211, crédito e pós somando 30%) quase não muda o risco: −10,7% na covid. O ganho dele está no imposto, que o laboratório não mede. Nenhum cenário histórico ou hipotético chega perto da trava de 30% de perda descrita na ata de 11/09.<\/p>"}], "changes": ["Copom cortou a Selic para 13,75% em 16/09.", "1º turno em 4/10: Ibovespa +7,7% no dia seguinte, recorde em 9/10; juro real curto caiu 70–90 bp.", "Dólar a R$ 5,01, queda de 9% no ano: pesa no VWRA11 e no GOLD11 em reais.", "Ouro 25% abaixo do pico de janeiro; Fed subiu juros em 16/09.", "Spread de debêntures DI estável em CDI + 0,93%, com recorde de recuperações judiciais.", "WRLD11 já tem R$ 1,34 bi; B5P211, R$ 4,50 bi; BLFT11, R$ 13,9 bi institucional.", "2º turno em 25/10: evento binário para a única perna comprada em Brasil.", "21/09: XP suspende compras de seis ETFs de crédito DI, inclusive DEBB11, por risco de IR de 25%.", "30/09: estreia o MUND11 (Investo, FTSE Global All Cap, 0,26% ao ano)."], "portGpa": 3.12, "portLetter": "B+"}, "funnel": {"lead": "Do universo inteiro à decisão do comitê, em cinco etapas. O rating de 0 a 4 é a etapa 4.", "steps": [["Universo", "Todos os ETFs da B3 em cada classe, mais os benchmarks fora da bolsa: Tesouro Direto e o ETF de origem no exterior."], ["Eliminatória", "Corta quem cair na blacklist prometida na ata de 11/09: público-alvo restrito, PL abaixo de R$ 50 mi, menos de 12 meses de cota, índice temático, estrutura sintética onde a tese pede físico, IR de 25% em renda fixa de longo prazo."], ["Custo efetivo", "Taxa total e retenção na fonte somadas em p.p. por ano, contra o mais barato da B3 no mesmo mandato, e a alíquota de IR à parte."], ["Rating", "Seis pilares com nota de 0 a 4 e letra. Fundamentos e custo efetivo pesam 45%."], ["Comitê", "Troca só quando a vantagem líquida passa de 0,15 p.p. ao ano depois do IR da própria troca. Revisão trimestral, com gatilhos escritos por posição."]]}, "etfs": [{"t": "B5P211", "name": "It Now IMA-B5 P2 Fundo de Índice", "leg": "Inflação curta", "headline": "a melhor posição da carteira, mal medida", "scores": {"p1": 4.0, "p2": 3.5, "p3": 3.95, "p4": 3.5, "p5": 4.0, "p6": 3.25}, "scoreNotes": {"p1": "NTN-B de até cinco anos, prazo médio acima de dois: o mandato que a tese descreve.", "p2": "IMA-B 5 rendendo IPCA + 6,46% (9/10), mesmo depois de cair ~80 bp na semana do primeiro turno.", "p3": "0,20%, um centésimo acima do NTNS11. IR de 15% sem come-cotas.", "p4": "Itaú, replicação física, desde 2020. A cota patrimonial no FNET é contínua; quem está quebrada é a série do Yahoo.", "p5": "R$ 4,50 bi de PL e R$ 16 mi de giro médio em seis meses.", "p6": "Duration de 2,2 anos: +1 p.p. de juro real custa ~2,2%, recompostos pelo carrego em poucos meses."}, "decision": {"l": "Manter", "tone": "good"}, "alt": {"t": "NTNS11", "why": "Mandato quase idêntico, mas 20 vezes menor e com prazo médio colado no limite de 720 dias que garante os 15%.", "gpa": 3.45, "letter": "A−"}, "mainIssue": "Nenhum relevante: juro real alto com prazo curto", "conf": "Alta", "thesis": {"t1": ["ok", "Soberano amplo, IPCA+ curto"], "t2": ["ok", "0,01 p.p. acima do NTNS11"], "t3": ["ok", "IR de 15%, sem come-cotas"], "t4": ["ok", "R$ 4,5 bi e R$ 16 mi/dia"], "t5": ["ok", "Juro real com volatilidade contida"], "t6": ["ok", "Perda de ~6,6% num choque de 3 p.p."]}, "lead": "O B5P211 é a melhor posição da carteira. Compra juro real de 6,5% acima da inflação, paga 15% de IR e tem R$ 4,5 bilhões de patrimônio. Medimos o fundo pela cota patrimonial do FNET, que é contínua; a série pública do Yahoo tem preço parado até janeiro de 2026.", "sections": [{"h": "Tese: por que essa classe está na carteira", "html": "<p>É a outra metade da renda fixa da tese: juro real brasileiro com duration limitada a cerca de dois anos, para capturar o IPCA + sem a volatilidade de prazos longos. Protege o poder de compra e ganha com a queda de juros.<\/p>"}, {"h": "Fundamentos: o juro real que se compra", "html": "<p>O IMA-B 5 rende <b>IPCA + 6,46%<\/b> (taxa média, 9/10) com duration de 557 dias úteis. Em 2/10 as NTN-B 2028 e 2030 estavam em 7,35% e 7,61%; caíram 70 a 90 bp na semana do primeiro turno. Mesmo assim, 6,5% real em papel de dois anos é alto para padrões internacionais e para a história recente brasileira. O IMA-B 5 rendeu 17,1% em 12 meses e 13,8% no ano.<\/p><p>O risco de preço é limitado: um choque de 1 p.p. no juro real custa cerca de 2,2% da cota, e o carrego de IPCA + 6,5% (cerca de 11% ao ano nominais) recompõe isso em pouco mais de dois meses.<\/p>"}, {"h": "Veículo: custo, estrutura e imposto", "html": "<p>Taxa de 0,20% ao ano (0,04% administração, 0,13% gestão, até 0,03% custódia), replicação física proibida de ser sintética, e <b>15% de IR<\/b> porque o prazo médio fica acima de 720 dias. Desde 08/01/2026, quando a série pública voltou a ter preço, o fundo rendeu 13,28% contra 13,54% do índice: aderência de ~0,26 p.p. no período, compatível com a taxa.<\/p>"}, {"h": "Alternativa: NTNS11", "html": "<p>O NTNS11 (Investo, Teva IPCA+ 0 a 4 anos) cobra 0,19% e também paga 15%. Tem R$ 231 mi e giro de R$ 0,9 mi. Com duration de 1,97 ano, o prazo médio fica colado nos 720 dias que garantem os 15%; um desenquadramento leva a 20%. Rating do NTNS11: A− (3,45). O B5P211 é melhor pela escala e pela folga do mandato.<\/p>"}, {"h": "Riscos e gatilhos de revisão", "html": "<ul><li>Eleição e fiscal: estresse fiscal com +2,5 p.p. de juro real custa ~5,5% da cota no choque.<\/li><li>Acompanhar a cota pelo FNET (informe diário) ou pela página do It Now, nunca pela série pública.<\/li><li>Na tese, LFTS11 e B5P211 dividem a renda fixa 50/50. A carteira proposta dá só 10% ao B5P211; com o LFTS11 pagando 25% de IR, há espaço para aumentar.<\/li><\/ul>"}], "facts": [["Ticker", "B5P211"], ["Índice", "IMA-B 5 P2 (ANBIMA)"], ["Carteira", "NTN-B até 63 meses"], ["Gestora / adm.", "Itaú Asset / Itaú Unibanco"], ["Taxa", "0,20% a.a."], ["Patrimônio", "R$ 4,50 bi (08/10)"], ["Cotistas", "44.246"], ["Giro médio", "R$ 16 mi/dia (6 meses)"], ["IR do cotista", "15%, sem come-cotas"], ["Duration do índice", "2,2 anos"], ["Taxa do índice", "IPCA + 6,46%"], ["Preço", "R$ 115,46 (13/10)"]], "factsSrc": "Fonte: regulamento Itaú, FNET/B3, ANBIMA, B3", "strip": [["Preço", "R$ 115,46"], ["Desde 08/01", "+13,3%"], ["IMA-B 5 12m", "+17,1%"], ["Desde 18/09", "+2,8%"], ["Vol.", "2,4%"], ["Juro real", "IPCA + 6,46%"]], "histTitle": "Choque de juro real na cota", "histCap": "Efeito imediato pela duration de 2,2 anos; o carrego não está incluído", "hist": [["−1 p.p.", 2.2, "Queda do juro real"], ["+1 p.p.", -2.2, "Similar ao susto fiscal de 2024"], ["+2 p.p.", -4.4, "Estresse fiscal moderado"], ["+3 p.p.", -6.6, "Estresse severo"]], "histSrc": "Fonte: ANBIMA (duration); cálculo Mercurius", "doc": "1H1_M47sstOk2YW6nolaagu0_749DxeTo", "gpa": 3.738, "letter": "A", "perf": {"title": "B5P211 contra o IMA-B 5 desde 08/01/2026", "cap": "Base 100 em 08/01/2026; antes disso a série pública não tem preço", "bench": "IMA-B 5", "pts": [["08 jan 26", 100.0, 100.0], ["09 jan 26", 99.95, 99.96], ["16 jan 26", 99.9, 99.95], ["23 jan 26", 100.34, 100.39], ["30 jan 26", 100.96, 100.98], ["06 fev 26", 101.25, 101.23], ["13 fev 26", 101.56, 101.56], ["20 fev 26", 101.7, 101.75], ["27 fev 26", 102.22, 102.21], ["06 mar 26", 102.14, 102.16], ["13 mar 26", 101.78, 101.75], ["20 mar 26", 102.66, 102.59], ["27 mar 26", 102.99, 103.02], ["02 abr 26", 103.86, 103.83], ["10 abr 26", 104.4, 104.41], ["17 abr 26", 104.87, 104.88], ["24 abr 26", 104.77, 104.83], ["30 abr 26", 104.98, 105.0], ["08 mai 26", 105.47, 105.49], ["15 mai 26", 105.2, 105.31], ["22 mai 26", 105.67, 105.78], ["29 mai 26", 105.92, 106.02], ["05 jun 26", 105.18, 105.35], ["12 jun 26", 105.87, 105.99], ["19 jun 26", 105.06, 105.43], ["26 jun 26", 105.8, 106.1], ["03 jul 26", 106.03, 106.36], ["10 jul 26", 106.62, 106.89], ["17 jul 26", 106.87, 107.15], ["24 jul 26", 107.06, 107.34], ["31 jul 26", 107.22, 107.56], ["07 ago 26", 107.77, 108.04], ["14 ago 26", 107.99, 108.26], ["21 ago 26", 108.55, 108.82], ["28 ago 26", 108.74, 108.96], ["04 set 26", 109.16, 109.47], ["11 set 26", 109.83, 110.13], ["18 set 26", 110.37, 110.61], ["25 set 26", 110.5, 110.75], ["02 out 26", 110.97, 111.25], ["09 out 26", 113.25, 113.54], ["13 out 26", 113.28, 113.47]], "src": "Fonte: Yahoo Finance, ANBIMA"}}, {"t": "GOLD11", "name": "Trend ETF LBMA Ouro Fundo de Índice", "leg": "Ouro", "headline": "um seguro que caiu 28%, e por isso funciona", "scores": {"p1": 3.75, "p2": 2.25, "p3": 4.0, "p4": 3.75, "p5": 4.0, "p6": 3.5}, "scoreNotes": {"p1": "Ouro físico via iShares Gold Trust. O comitê define ouro como seguro e exige lastro físico.", "p2": "Ouro a US$ 4.179, 25% abaixo do pico de janeiro, com juro real americano de 2,91% e Fed subindo. Bancos centrais seguem comprando.", "p3": "0,55% (0,30% local + 0,25% do IAU), o único ouro físico da B3. O GOLB11 custa 0,40%, mas fica fora do mandato. IR de 15%.", "p4": "Feeder único do IAU (BlackRock, US$ 62 bi). Desde 2020.", "p5": "R$ 1,81 bi de PL, 135 mil cotistas e R$ 36 mi de giro médio.", "p6": "Em reais, subiu em quase toda crise brasileira (+8% no Joesley, +28% em 2015, +13% na covid)."}, "decision": {"l": "Manter", "tone": "good"}, "alt": {"t": "GOLB11", "why": "Mais barato, mas é futuro de ouro na B3, sem lastro físico. O carrego da LFT já está no preço do futuro.", "gpa": 2.888, "letter": "B+"}, "mainIssue": "Ouro caro em juro real e dólar fraco", "conf": "Alta", "thesis": {"t1": ["ok", "Ouro físico, sem tese temática"], "t2": ["ok", "Único ouro físico da B3"], "t3": ["ok", "IAU não paga dividendo; IR de 15%"], "t4": ["ok", "R$ 1,8 bi e R$ 36 mi/dia"], "t5": ["ok", "Seguro contra crise Brasil"], "t6": ["ok", "Sobe quando o Brasil cai"]}, "lead": "Mantemos o GOLD11 pelo motivo que o comitê deu: ele é seguro de carteira. Em 12 meses perdeu 7,6% e chegou a cair 28% do topo, porque o ouro corrigiu 25% desde janeiro e o real subiu 9%. É exatamente o comportamento de um seguro em ano sem sinistro.", "sections": [{"h": "Tese: por que essa classe está na carteira", "html": "<p>Ouro é uma das seis classes do Capital Map e, no comitê de 25/09, foi definido como <b>seguro de carteira<\/b>: deve conter quedas e a volatilidade emocional do cliente em crise. Retorno é secundário. O comitê também fixou o lastro físico como requisito, o que define o veículo.<\/p>"}, {"h": "Fundamentos: o preço do seguro", "html": "<p>O ouro está em <b>US$ 4.179<\/b> (13/10), 3% abaixo do fim de 2025 e 25% abaixo do pico de US$ 5.589 em 28/01/2026. O segundo trimestre foi o pior desde 2013. A relação inversa com o juro real voltou: o TIPS de 10 anos subiu de 1,93% para 2,91% e o Fed subiu juros em 16/09. O que segura o preço são os bancos centrais, que compraram 863 toneladas em 2025 e 345 no primeiro semestre de 2026.<\/p><p>Em reais o efeito é dobrado: o dólar caiu 9% no ano. A nota de fundamentos é baixa porque o ouro continua caro em termos reais. A de comportamento em estresse é alta porque, em reais, ele subiu em quase toda crise brasileira medida.<\/p>"}, {"h": "Veículo: custo, estrutura e imposto", "html": "<p>O GOLD11 compra o iShares Gold Trust (IAU, US$ 62 bi, taxa de 0,25%) e cobra 0,30% localmente: <b>0,55% no total<\/b>, com teto de 0,57% no regulamento. O IAU não distribui renda, então não há retenção nos EUA. Para o cotista vale 15% sobre o ganho, sem a isenção de R$ 20 mil. Gestão da XP Allocation, administração do BNP Paribas.<\/p>"}, {"h": "Alternativa: GOLB11", "html": "<p>O GOLB11 (BTG Pactual) monta a exposição com futuro de ouro da B3 e cobra 0,40%. Negocia desde <b>24/10/2025<\/b>. Tem R$ 466 mi.<\/p><p>O carrego das LFTs da garantia não é ganho extra: o preço do futuro já embute o juro, e quem rola o contrato devolve na base o carrego que a LFT da garantia rende. A vantagem real é a diferença de taxa, 0,15 p.p., menos o custo de rolagem. Rating do GOLB11: B+ (2,89), fora do mandato por não ter lastro físico.<\/p>"}, {"h": "Riscos e gatilhos de revisão", "html": "<ul><li>Peso: o seguro funciona com 5% a 10%. Acima disso, a taxa e a volatilidade de 27% pesam no retorno total.<\/li><li>Quem compra VWRA11 e GOLD11 compra dólar duas vezes. Em cenário de real forte, as duas pernas caem juntas.<\/li><li>Rever se o comitê aceitar exposição sintética: aí o GOLB11 volta a competir pela taxa.<\/li><\/ul>"}], "facts": [["Ticker", "GOLD11"], ["Índice", "LBMA Gold Price"], ["Estrutura", "Feeder do IAU (EUA)"], ["Gestora / adm.", "XP Allocation / BNP Paribas"], ["Taxa total", "0,55% a.a. (0,30 + 0,25)"], ["Patrimônio", "R$ 1,81 bi (09/10)"], ["Cotistas", "135.396"], ["Giro médio", "R$ 35,8 mi/dia (6 meses)"], ["IR do cotista", "15% sobre ganho"], ["Rendimentos", "Acumula"], ["Preço", "R$ 21,66 (13/10)"], ["Desde o início", "14,2% a.a."]], "factsSrc": "Fonte: regulamento GOLD11, FNET/B3, iShares, B3", "strip": [["Preço", "R$ 21,66"], ["12m", "−7,6%"], ["Ano", "−12,6%"], ["Desde 18/09", "−6,3%"], ["Vol. 12m", "27,0%"], ["Queda máx. 12m", "−27,9%"]], "histTitle": "Ouro em reais nas crises", "histCap": "Ouro em dólar convertido pela PTAX", "hist": [["Crise global 2008", 40.5, "set. a nov. 2008"], ["Recessão BR 2015", 28.4, "mai/2015 a jan/2016"], ["Covid 2020", 13.3, "19/02 a 23/03/2020"], ["Joesley 2017", 8.3, "17 a 18/05/2017"], ["Susto fiscal 2024", 7.7, "25/11 a 18/12/2024"], ["Juros globais 2022", -14.6, "jan. a out. 2022"]], "histSrc": "Fonte: Yahoo Finance, BCB (PTAX); cálculo Mercurius", "doc": "17n4gqHZ7ItOhjZhDY4dwUyIRJbNf4rQx", "gpa": 3.513, "letter": "A", "perf": {"title": "GOLD11 contra o CDI em 12 meses", "cap": "Base 100 em 13/10/2025, pontos semanais", "bench": "CDI", "pts": [["13 out 25", 100.0, 100.0], ["17 out 25", 101.84, 100.22], ["23 out 25", 98.76, 100.44], ["31 out 25", 95.82, 100.77], ["07 nov 25", 95.13, 101.05], ["14 nov 25", 96.41, 101.33], ["21 nov 25", 97.74, 101.56], ["28 nov 25", 99.96, 101.84], ["05 dez 25", 101.84, 102.12], ["12 dez 25", 103.63, 102.4], ["19 dez 25", 106.96, 102.68], ["26 dez 25", 111.78, 102.91], ["02 jan 26", 104.57, 103.13], ["09 jan 26", 107.47, 103.42], ["16 jan 26", 109.52, 103.7], ["23 jan 26", 117.16, 103.99], ["30 jan 26", 113.36, 104.28], ["06 fev 26", 114.9, 104.57], ["13 fev 26", 116.73, 104.85], ["20 fev 26", 117.33, 105.03], ["27 fev 26", 119.97, 105.32], ["06 mar 26", 120.02, 105.61], ["13 mar 26", 118.48, 105.9], ["20 mar 26", 106.02, 106.19], ["27 mar 26", 104.91, 106.48], ["02 abr 26", 107.17, 106.71], ["10 abr 26", 106.02, 107.0], ["17 abr 26", 107.51, 107.29], ["24 abr 26", 104.44, 107.52], ["30 abr 26", 101.62, 107.76], ["08 mai 26", 102.6, 108.04], ["15 mai 26", 101.96, 108.33], ["22 mai 26", 100.43, 108.62], ["29 mai 26", 101.49, 108.91], ["05 jun 26", 98.8, 109.15], ["12 jun 26", 94.41, 109.44], ["19 jun 26", 95.82, 109.73], ["26 jun 26", 93.21, 110.02], ["03 jul 26", 95.13, 110.31], ["10 jul 26", 93.17, 110.6], ["17 jul 26", 90.91, 110.89], ["24 jul 26", 91.21, 111.18], ["31 jul 26", 91.17, 111.47], ["07 ago 26", 97.99, 111.76], ["14 ago 26", 101.24, 112.05], ["21 ago 26", 105.38, 112.34], ["28 ago 26", 102.82, 112.63], ["04 set 26", 100.98, 112.92], ["11 set 26", 98.85, 113.16], ["18 set 26", 99.83, 113.45], ["25 set 26", 98.42, 113.73], ["02 out 26", 95.82, 114.02], ["09 out 26", 92.49, 114.31], ["13 out 26", 92.45, 114.31]], "src": "Fonte: Yahoo Finance, BCB (CDI)"}}, {"t": "DIVO11", "name": "It Now IDIV Fundo de Índice", "leg": "Dividendos Brasil", "headline": "o fator da casa, barato e concentrado", "scores": {"p1": 2.75, "p2": 3.0, "p3": 4.0, "p4": 3.75, "p5": 4.0, "p6": 2.25}, "scoreNotes": {"p1": "Fatorial de dividendos, aceito pela tese como exceção explícita. Metade do patrimônio em seis companhias.", "p2": "Ibovespa perto de 9,4x lucro projetado, abaixo da média de 10 anos (10,5x), mesmo depois da alta de 28% no ano.", "p3": "0,50% a.a., igual ao NSDV11, o outro ETF de dividendos estudado. Sem camada externa, dividendos reinvestidos e IR de 15%.", "p4": "Replicação direta, Itaú, desde 2012. Índice de retorno total.", "p5": "R$ 2,79 bi de PL e R$ 23–31 mi de giro diário.", "p6": "Sem amortecedor cambial: −38% na covid, −37% na recessão de 2015. É a única perna comprada em Brasil."}, "decision": {"l": "Manter", "tone": "good"}, "alt": {"t": "NSDV11", "why": "Índice de qualidade de dividendo, mas 19 nomes, 63% em utilidade pública e financeiro e PL de R$ 164 mi.", "gpa": 3.013, "letter": "B+"}, "mainIssue": "Concentração em seis companhias e risco eleitoral", "conf": "Alta", "thesis": {"t1": ["at", "Fatorial, aceito como exceção"], "t2": ["ok", "Mesma taxa do concorrente"], "t3": ["ok", "Brasil, sem camada externa, acumula"], "t4": ["ok", "R$ 2,8 bi e R$ 23+ mi/dia"], "t5": ["ok", "Única perna de ações Brasil"], "t6": ["at", "Cauda de −38% a −45% em crise local"]}, "lead": "Mantemos o DIVO11. É o ETF mais maduro da carteira, o índice pesa empresas que pagam dividendo de forma recorrente e o preço do mercado brasileiro ainda está abaixo da média histórica. O que pede atenção agora é o calendário: o segundo turno de 25/10 é um evento binário para a única perna da carteira comprada em Brasil.", "sections": [{"h": "Tese: por que essa classe está na carteira", "html": "<p>A tese é ampla e neutra, e o DIVO11 é a exceção declarada: um índice fatorial, usado porque dividendos são, segundo o comitê, a classe de ações brasileiras que historicamente supera o Ibovespa e a renda fixa no longo prazo. Desde 2012, o DIVO11 rendeu <b>11,2% ao ano contra 9,8% do CDI<\/b>, com alfa mensal estimado de 0,5% sobre o Ibovespa.<\/p><p>Na carteira, ele é a perna de risco Brasil e o diversificador real: tem correlação negativa com crédito, pós-fixado e ouro.<\/p>"}, {"h": "Fundamentos: o que se compra, e a que preço", "html": "<p>O IDIV seleciona o terço da bolsa com maior dividend yield em 36 meses e pondera pelo próprio yield, com teto de três vezes o peso de mercado e 10% por companhia. A carteira hoje: <b>Petrobras 11,2%, Bradesco 10,4%, Itaú 9,8%, Itaúsa 6,2%<\/b>, Copel 4,9%, BB Seguridade 4,7%, Banco do Brasil 4,3%. Financeiro e estatais dominam.<\/p><p>O Ibovespa estava a cerca de 8,5 vezes o lucro projetado antes do primeiro turno, contra média de 10 anos de 10,5 vezes. Depois da alta de 7,7% em 5/10, a estimativa é de 9,4 vezes. Mesmo com o índice em recorde (+28,4% no ano, +47,5% em 12 meses), o múltiplo não está esticado. O que mudou é o risco: a Selic de 13,75% ainda remunera a espera, e o resultado de 25/10 pode desfazer parte da alta em um dia.<\/p>"}, {"h": "Veículo: custo, estrutura e imposto", "html": "<p>Taxa de 0,50% ao ano, a mesma do NSDV11. O fundo compra as ações direto, sem camada externa e sem vazamento de dividendos, e reinveste os proventos dentro da cota. O cotista paga 15% sobre o ganho de capital, sem a isenção de R$ 20 mil das ações.<\/p><p>O índice é de retorno total. Patrimônio de R$ 2,79 bilhões, 55,4 mil cotistas e giro de R$ 23 a 31 milhões por dia: a execução está resolvida.<\/p>"}, {"h": "Alternativa: NSDV11", "html": "<p>O NSDV11 replica o Ibov Smart Dividendos, que pondera por recorrência, yield e estabilidade, e corrige a armadilha de comprar quem caiu. Em troca, são 19 nomes com 63% em utilidade pública e financeiro. Em 12 meses rendeu 31,7% contra 40,0% do DIVO11. Cresceu para R$ 164 mi de PL. Rating do NSDV11: <b>B+ (3,01)<\/b>.<\/p>"}, {"h": "Riscos e gatilhos de revisão", "html": "<ul><li>Eleição: definir antes de 25/10 se a casa rebalanceia por aportes ou aceita a oscilação. A tese diz não fazer timing.<\/li><li>Concentração: se a carteira do cliente já tem bancos e Petrobras, o IDIV soma ao risco em vez de diversificar.<\/li><li>Tributação de dividendos (Lei 15.270/2025): confirmar com o emissor que o reinvestimento dentro do fundo segue sem retenção.<\/li><\/ul>"}], "facts": [["Ticker", "DIVO11"], ["Índice", "IDIV (B3), retorno total"], ["Estrutura", "Replicação direta"], ["Gestora / adm.", "Itaú Asset / Itaú Unibanco"], ["Taxa total", "0,50% a.a."], ["Patrimônio", "R$ 2,79 bi (08/10)"], ["Cotistas", "55.361"], ["Giro médio", "R$ 23,5 mi/dia (set.)"], ["IR do cotista", "15% sobre ganho"], ["Dividendos", "Reinvestidos"], ["Preço", "R$ 146,00 (13/10)"], ["Retorno 12 meses", "+40,0%"]], "factsSrc": "Fonte: FNET/B3, Itaú Asset, B3, Yahoo Finance", "strip": [["Preço", "R$ 146,00"], ["12m", "+40,0%"], ["Ano", "+24,8%"], ["Desde 18/09", "+10,3%"], ["Vol. 12m", "18,6%"], ["Queda máx. 12m", "−16,1%"]], "histTitle": "DIVO11 nas crises", "histCap": "Variação do ETF em cada episódio", "hist": [["Covid 2020", -38.3, "19/02 a 23/03/2020"], ["Recessão BR 2015", -36.9, "mai/2015 a jan/2016"], ["Joesley 2017", -11.4, "17 a 18/05/2017"], ["Greve 2018", -10.4, "15/05 a 30/06/2018"], ["Juros globais 2022", 10.7, "jan. a out. 2022"], ["Pior mês 2026", -11.9, "16/04 a 19/05/2026"]], "histSrc": "Fonte: Yahoo Finance; cálculo Mercurius", "doc": "19gaVxv46Ar-Apj_xD8afj-gSxzEvGRWJ", "gpa": 3.338, "letter": "A−", "perf": {"title": "DIVO11 contra o Ibovespa em 12 meses", "cap": "Base 100 em 13/10/2025, pontos semanais", "bench": "Ibovespa", "pts": [["13 out 25", 100.0, 100.0], ["17 out 25", 100.76, 101.14], ["24 out 25", 102.15, 103.1], ["31 out 25", 104.88, 105.47], ["07 nov 25", 107.13, 108.66], ["14 nov 25", 109.2, 111.25], ["21 nov 25", 107.46, 109.16], ["28 nov 25", 110.54, 112.19], ["05 dez 25", 108.5, 110.99], ["12 dez 25", 110.87, 113.39], ["19 dez 25", 109.92, 111.77], ["26 dez 25", 111.79, 113.48], ["02 jan 26", 111.49, 113.23], ["09 jan 26", 112.56, 115.23], ["16 jan 26", 113.23, 116.23], ["23 jan 26", 122.26, 126.15], ["30 jan 26", 123.85, 127.92], ["06 fev 26", 124.77, 129.04], ["13 fev 26", 127.07, 131.51], ["20 fev 26", 129.73, 134.38], ["27 fev 26", 129.53, 133.15], ["06 mar 26", 123.81, 126.51], ["13 mar 26", 122.92, 125.3], ["20 mar 26", 121.24, 124.29], ["27 mar 26", 125.85, 128.05], ["02 abr 26", 129.12, 132.63], ["10 abr 26", 134.97, 139.17], ["17 abr 26", 133.92, 138.05], ["24 abr 26", 130.03, 134.53], ["30 abr 26", 128.0, 132.12], ["08 mai 26", 124.48, 129.85], ["15 mai 26", 120.07, 125.04], ["22 mai 26", 119.61, 124.28], ["29 mai 26", 118.78, 122.57], ["05 jun 26", 115.75, 119.21], ["12 jun 26", 118.47, 120.7], ["19 jun 26", 116.81, 118.9], ["26 jun 26", 120.59, 122.23], ["03 jul 26", 120.98, 122.91], ["10 jul 26", 125.02, 125.45], ["17 jul 26", 122.03, 122.52], ["24 jul 26", 121.55, 122.75], ["31 jul 26", 123.83, 125.54], ["07 ago 26", 119.37, 121.67], ["14 ago 26", 115.1, 117.74], ["21 ago 26", 117.43, 120.63], ["28 ago 26", 120.07, 123.9], ["04 set 26", 127.42, 130.58], ["11 set 26", 128.48, 132.04], ["18 set 26", 126.76, 130.64], ["25 set 26", 124.88, 129.41], ["02 out 26", 130.44, 135.5], ["09 out 26", 142.0, 147.46], ["13 out 26", 140.03, 145.92]], "src": "Fonte: Yahoo Finance, B3"}}, {"t": "LFTS11", "name": "Investo Teva Tesouro Selic ETF", "leg": "Pós-fixado Selic", "headline": "ótimo carrego, imposto errado, e a saída é da própria Investo", "scores": {"p1": 3.5, "p2": 4.0, "p3": 1.7, "p4": 3.25, "p5": 4.0, "p6": 3.5}, "scoreNotes": {"p1": "Tesouro Selic, o ativo de menor risco do país. Índice com LFTs de 2028 a 2032.", "p2": "Selic de 13,75% com IPCA de 4,58%: juro real ex-post perto de 9%, entre os mais altos do mundo.", "p3": "Taxa de 0,19%, 0,06 p.p. acima do BLFT11 (nota de custo 3,4). IR de 25% desde 26/02/2024 (nota 0), enquanto o LFTB11, da mesma gestora e com a mesma taxa, paga 15%. Média 1,7.", "p4": "Investo, desde 2022. Anunciou troca de índice em 19/08 e suspendeu em 15/09: ruído de governança.", "p5": "R$ 2,02 bi de PL e ~R$ 25 mi de giro diário, a maior liquidez de renda fixa da B3.", "p6": "Volatilidade de 0,3% em 12 meses. Risco relevante é a abertura de ágio das LFTs longas."}, "decision": {"l": "Migrar para LFTB11", "tone": "info"}, "alt": {"t": "BLFT11", "why": "Taxa menor, mesmo IR de 25% e liquidez em bolsa não confirmada. Não resolve o problema.", "gpa": 3.013, "letter": "B+"}, "mainIssue": "IR de 25%; o LFTB11 paga 15% pela mesma taxa", "conf": "Alta", "thesis": {"t1": ["ok", "Tesouro Selic amplo"], "t2": ["at", "0,06 p.p. acima do BLFT11"], "t3": ["no", "IR de 25% sem regressão"], "t4": ["ok", "R$ 2 bi e R$ 25 mi/dia"], "t5": ["ok", "Núcleo de renda fixa da tese"], "t6": ["ok", "Oscilação mínima"]}, "lead": "O LFTS11 paga 25% de IR desde fevereiro de 2024, e a ata de 04/09 estava errada ao dizer 15%. A saída já existe e é da mesma gestora: o LFTB11 (Smart Selic) cobra os mesmos 0,19%, paga 15% e é três vezes maior. Recomendamos levar o núcleo de longo prazo para o LFTB11 por aportes novos e deixar o LFTS11 só para caixa de curto prazo.", "sections": [{"h": "Tese: por que essa classe está na carteira", "html": "<p>A renda fixa Brasil é metade do Capital Map quando o cliente não tem meta específica, dividida entre LFTS11 e B5P211. O pós-fixado é a âncora: rende o CDI, quase não oscila e serve de fonte para rebalancear por aportes.<\/p>"}, {"h": "Fundamentos: o carrego", "html": "<p>A Selic está em <b>13,75%<\/b> depois de cinco cortes, e o Focus projeta 13,25% no fim de 2026 e 12% no fim de 2027. Com IPCA de 4,58% em 12 meses, o juro real ex-post fica perto de 9%. Poucos ativos no mundo pagam isso sem risco de crédito. O ágio das LFTs longas está estável (LFT 2032 com 11 bp sobre a Selic). Pelo preço, o pós-fixado é o ativo mais bem remunerado da carteira.<\/p>"}, {"h": "Veículo: o imposto é o problema", "html": "<p>O Comunicado 03/2024 do Tesouro passou a tratar a LFT como papel de prazo de repactuação de um dia. Desde 26/02/2024, o LFTS11 recolhe <b>25% sobre o ganho<\/b>, qualquer que seja o prazo. Não há come-cotas e o imposto só sai na venda, o que é bom, mas a alíquota é a pior da tabela.<\/p><p>Por R$ 100 de CDI, depois de taxa e imposto, num horizonte acima de dois anos, sobram cerca de: <b>R$ 74 no LFTS11<\/b>, R$ 74 no BLFT11, R$ 84 no Tesouro Selic direto (15% após dois anos, custódia de 0,20%) e R$ 87 no DEBB11 (R$ 77 se o IR do crédito DI também for para 25%). A diferença para o Tesouro direto é de ~1,3 p.p. de CDI por ano. A tese promete eficiência tributária e, nesta perna, não entrega.<\/p><p>Os ETFs do tipo Smart Selic chegam a 15% misturando cerca de 91% de LFT com 9% de NTN-B longa, para passar de 720 dias de prazo médio. O preço disso é uma pequena exposição a juro real longo e o risco de desenquadramento, como o caso de 22% de IR citado na ata de 04/09.<\/p>"}, {"h": "A alternativa que resolve: LFTB11", "html": "<p>O <b>LFTB11<\/b> (Investo Smart Selic, desde 05/11/2024) cobra 0,19%, como o LFTS11, mira 760 dias de prazo médio e paga <b>15% de IR<\/b>. Tem R$ 6,55 bi de patrimônio, 76,6 mil cotistas e ~R$ 77 mi de giro diário, três vezes o LFTS11. Por R$ 100 de CDI, depois de taxa e imposto, deixa ~R$ 84, contra R$ 74 do LFTS11.<\/p><p>Outros do mesmo tipo: LTBX11 (XP/Trend, 0,14%, R$ 417 mi), POSB11 (Galapagos, isento de taxa até nov/26, R$ 607 mi) e LIQB11 (BTG, 0,15%, R$ 56 mi). O LFTB11 é o único com escala e histórico de quase dois anos. Para caixa de semanas, o LFTS11 continua adequado; a diferença de IR só pesa em quem fica mais de um ano.<\/p>"}, {"h": "Alternativa: BLFT11", "html": "<p>O BLFT11 compra só LFTs curtas, cobra 0,10% (mais até 0,03% de custódia) e oscila 0,25%. Tem R$ 13,9 bilhões de patrimônio, mas apenas 445 cotistas: o dinheiro é institucional e o giro em bolsa é incerto (R$ 9 mil a R$ 1,3 mi por dia, conforme a fonte). Paga os mesmos 25% de IR. A troca economizaria 0,06 a 0,09 p.p. e deixaria o imposto onde está. <b>Não recomendamos a troca.<\/b> Rating do BLFT11: B+ (3,01).<\/p>"}, {"h": "Riscos e gatilhos de revisão", "html": "<ul><li>Migrar o núcleo de longo prazo para o LFTB11 por aportes; vender LFTS11 só onde o ganho acumulado for pequeno, porque a venda recolhe 25%.<\/li><li>Acompanhar o prazo médio do LFTB11: se cair abaixo de 720 dias, a faixa vai a 20%.<\/li><li>Acompanhar a troca de índice anunciada e suspensa pela Investo.<\/li><li>Ágio de LFT longa: um choque de 50 bp custa ~1,3% da cota.<\/li><\/ul>"}], "facts": [["Ticker", "LFTS11"], ["Índice", "Teva Tesouro Selic"], ["Carteira", "14 LFTs, 2028 a 2032"], ["Gestora / adm.", "Investo / BNP Paribas"], ["Taxa", "0,19% a.a."], ["Patrimônio", "R$ 2,02 bi (09/10)"], ["Cotistas", "18.100"], ["Giro médio", "~R$ 25 mi/dia"], ["IR do cotista", "25% (desde 26/02/2024)"], ["Formador de mercado", "BTG Pactual"], ["Preço", "R$ 161,28 (13/10)"], ["Desde o início", "13,0% a.a. (99% do CDI)"]], "factsSrc": "Fonte: lâmina Investo (30/09/2026), FNET/B3, Tesouro Nacional, Yahoo Finance", "strip": [["Preço", "R$ 161,28"], ["12m", "+14,3% (99,4% CDI)"], ["Ano", "+11,0%"], ["Desde 18/09", "+0,8%"], ["Vol. 12m", "0,3%"], ["IR", "25%"]], "histTitle": "Quanto sobra de R$ 100 de CDI", "histCap": "Depois de taxa e IR, horizonte acima de dois anos, CDI de 13,25%", "hist": [["DEBB11 (15%)", 87.4, "CDI + 0,37% líquido de taxa, IR de 15%"], ["DEBB11 (se 25%)", 77.1, "Mesmo carrego com IR de 25%, risco em discussão desde 21/09"], ["Tesouro Selic direto", 83.7, "Custódia B3 de 0,20%, IR de 15% após 720 dias"], ["LFTB11 (15%)", 83.8, "Smart Selic, taxa de 0,19%, IR de 15%"], ["BLFT11 (25%)", 74.3, "Taxa até 0,13%, IR de 25%"], ["LFTS11 (25%)", 73.9, "Taxa de 0,19%, IR de 25%"]], "histSrc": "Fonte: cálculo Mercurius; Lei 13.043/2014, Tesouro Nacional", "histFmt": "plain", "doc": "1GZW-07JdhGDV4gebpTwnE5y9ydGvEoe0", "gpa": 3.163, "letter": "A−", "perf": {"title": "LFTS11 contra o CDI em 12 meses", "cap": "Base 100 em 13/10/2025, pontos semanais", "bench": "CDI", "pts": [["13 out 25", 100.0, 100.0], ["16 out 25", 100.17, 100.17], ["23 out 25", 100.44, 100.44], ["30 out 25", 100.72, 100.72], ["07 nov 25", 101.05, 101.05], ["14 nov 25", 101.33, 101.33], ["21 nov 25", 101.55, 101.56], ["28 nov 25", 101.82, 101.84], ["05 dez 25", 102.09, 102.12], ["12 dez 25", 102.37, 102.4], ["18 dez 25", 102.6, 102.62], ["26 dez 25", 102.88, 102.91], ["02 jan 26", 103.1, 103.13], ["09 jan 26", 103.47, 103.42], ["16 jan 26", 103.73, 103.7], ["23 jan 26", 104.05, 103.99], ["30 jan 26", 104.3, 104.28], ["06 fev 26", 104.6, 104.57], ["13 fev 26", 104.87, 104.85], ["20 fev 26", 105.02, 105.03], ["27 fev 26", 105.32, 105.32], ["06 mar 26", 105.63, 105.61], ["13 mar 26", 105.91, 105.9], ["20 mar 26", 106.22, 106.19], ["27 mar 26", 106.53, 106.48], ["02 abr 26", 106.77, 106.71], ["10 abr 26", 107.07, 107.0], ["17 abr 26", 107.34, 107.29], ["24 abr 26", 107.56, 107.52], ["30 abr 26", 107.8, 107.76], ["08 mai 26", 108.07, 108.04], ["15 mai 26", 108.36, 108.33], ["22 mai 26", 108.63, 108.62], ["29 mai 26", 108.94, 108.91], ["05 jun 26", 109.18, 109.15], ["12 jun 26", 109.46, 109.44], ["19 jun 26", 109.73, 109.73], ["26 jun 26", 110.05, 110.02], ["03 jul 26", 110.32, 110.31], ["10 jul 26", 110.62, 110.6], ["17 jul 26", 110.87, 110.89], ["24 jul 26", 111.18, 111.18], ["31 jul 26", 111.48, 111.47], ["07 ago 26", 111.74, 111.76], ["14 ago 26", 112.1, 112.05], ["21 ago 26", 112.34, 112.34], ["28 ago 26", 112.64, 112.63], ["04 set 26", 112.93, 112.92], ["11 set 26", 113.13, 113.16], ["18 set 26", 113.44, 113.45], ["25 set 26", 113.71, 113.73], ["02 out 26", 113.94, 114.02], ["09 out 26", 114.24, 114.31], ["13 out 26", 114.29, 114.31]], "src": "Fonte: Yahoo Finance, BCB (CDI)"}}, {"t": "VWRA11", "name": "Investo FTSE All-World Fundo de Índice", "leg": "Ações globais", "headline": "o melhor acesso da B3 ao mundo, e ainda caro", "scores": {"p1": 4.0, "p2": 2.25, "p3": 3.1, "p4": 3.0, "p5": 2.0, "p6": 3.0}, "scoreNotes": {"p1": "FTSE All-World, cerca de 4.000 ações em 49 países, ponderado por mercado. É a definição de amplo e neutro.", "p2": "MSCI ACWI a 16,3x lucro projetado e 1,6% de dividendos; CAPE americano em 41,9; 25% nos dez maiores, quase todos da cadeia de IA.", "p3": "Custo efetivo ≈ 0,56% a.a. (0,44% de taxa + ~0,12 p.p. de retenção sobre dividendos americanos). O MUND11, lançado em 30/09, faz o mesmo por ~0,38% (0,26% de taxa); 0,18 p.p. de diferença dá nota de custo 2,2. IR de 15% (nota 4). Média 3,1.", "p4": "Feeder de um único ETF irlandês da Vanguard. Documento do FNET cita índice errado e a lâmina traz data de início copiada do WRLD11.", "p5": "PL de R$ 155,9 mi (08/10) e giro de ~R$ 2,8 mi/dia; spread de tela alto no home broker, conforme a ata de 11/09.", "p6": "Em reais, o dólar amortece: na covid caiu 22,9% contra 45,4% do Ibovespa; em 2022 caiu 29,1% com o Brasil subindo."}, "decision": {"l": "Manter; vigiar MUND11", "tone": "info"}, "alt": {"t": "WRLD11", "why": "Maior e mais líquido, mas a rota americana retém 30% de toda a distribuição do VT.", "gpa": 2.9, "letter": "B+"}, "mainIssue": "MUND11 faz o mesmo por 0,26%", "conf": "Alta", "thesis": {"t1": ["ok", "Amplo, neutro, ponderado por mercado"], "t2": ["at", "MUND11 custa 0,26% contra 0,44%"], "t3": ["ok", "Irlanda: 15% de retenção e acumulação"], "t4": ["at", "PL de R$ 156 mi e spread largo"], "t5": ["ok", "Principal perna dolarizada da carteira"], "t6": ["ok", "Cai menos que o Brasil em crise local"]}, "lead": "Mantemos o VWRA11 como a perna de ações globais. Ele vence o WRLD11 por cerca de 0,28 p.p. ao ano depois de imposto. Desde 30/09 existe uma alternativa mais barata da própria Investo, o MUND11 (0,26% ao ano, com small caps). Ele ainda tem só R$ 14 mi de patrimônio; a troca faz sentido quando ganhar escala.", "sections": [{"h": "Tese: por que essa classe está na carteira", "html": "<p>Ações globais são a classe que entrega o crescimento da economia mundial em dólar, e é a <b>principal perna dolarizada<\/b> da carteira de ETFs, ao lado do ouro. A tese pede o índice inteiro, sem apostar em país, setor ou fator. O FTSE All-World faz exatamente isso: grande e média capitalização em 49 países, ponderadas por valor de mercado.<\/p><p>O VWRA11 não tem small caps, e isso está alinhado com a decisão do comitê de 25/09 de reservar o fator small caps a clientes com horizonte de 20 anos ou mais.<\/p>"}, {"h": "Fundamentos: o que se compra, e a que preço", "html": "<p>O mercado global está caro, e a conta vem quase toda dos Estados Unidos. O MSCI ACWI negocia a <b>16,3 vezes o lucro projetado<\/b> (21,4 vezes o lucro passado) e paga 1,6% de dividendos. O peso caro é o americano: 62% do índice, com CAPE de 41,9, perto do pico de 1999. Os dez maiores nomes somam 24,8% e cerca de 20 pontos disso estão na cadeia de inteligência artificial.<\/p><p>O juro também mudou. O Treasury de 10 anos está em 5,24% e o real em 2,91%, contra 4,18% e 1,93% no fim de 2025, e o prêmio de risco implícito de Damodaran caiu para 4,2%. Ações globais competem com um juro americano alto e, para o investidor brasileiro, com um CDI de 13,65%. Em 12 meses o VWRA11 rendeu 8,6%, ou 60% do CDI, porque o real se valorizou 9% no ano.<\/p><p>Esperamos retorno moderado em dólar. O papel da posição é diversificar a carteira; contra o CDI ela perde na maior parte dos anos de juro alto. É isso que a nota de fundamentos reflete.<\/p>"}, {"h": "Veículo: custo, estrutura e imposto", "html": "<p>A taxa total é 0,44% ao ano: 0,30% da camada brasileira e 0,14% do ETF irlandês, que a Vanguard reduziu de 0,19% em 28/07/2026. Somando a retenção de 15% sobre dividendos americanos dentro do fundo irlandês, o custo efetivo fica perto de <b>0,56% ao ano<\/b>.<\/p><p>No WRLD11 a conta é outra. O VT é americano e paga 30% de retenção sobre toda a distribuição ao fundo brasileiro, cerca de 0,48 p.p. sobre um yield de 1,6%. O custo efetivo vai a ~0,84%. Comparando a retenção de cada rota, a vantagem líquida do VWRA11 é de ~0,28 p.p. ao ano.<\/p><p>Para o cotista vale 15% de IR sobre o ganho, sem a isenção de R$ 20 mil. Para clientes com conta no exterior, comprar o VWRA direto custa 0,14% e cumpre a tese melhor que qualquer veículo da B3.<\/p>"}, {"h": "Alternativa: WRLD11", "html": "<p>O WRLD11 cresceu muito: tem <b>R$ 1,34 bilhão<\/b> (09/10/2026), 70 mil cotistas e giro de ~R$ 12,6 mi por dia. Na escala, o WRLD11 ganha com folga. No custo depois de imposto, perde por ~0,28 p.p. ao ano, e esse custo é permanente, enquanto o problema de escala do VWRA11 diminui a cada mês. Rating do WRLD11: <b>B+ (2,90)<\/b>.<\/p>"}, {"h": "Concorrente novo: MUND11", "html": "<p>Em 30/09/2026 a Investo lançou o <b>MUND11<\/b>, feeder do Vanguard FTSE Global All-Cap UCITS (VALU/VALL, Irlanda, taxa de 0,07%). A taxa local é 0,19%, total de <b>0,26%<\/b>, contra 0,44% do VWRA11. Inclui small caps (cerca de 6.400 ações na carteira do fundo de origem) e mantém a retenção de 15% da Irlanda. A curadoria da Stop Loss já indica o MUND11 no lugar do VWRA11, esperando o patrimônio crescer.<\/p><p>Em 09/10 o MUND11 tinha R$ 14,5 mi e 1.092 cotistas, e o fundo irlandês de origem tinha US$ 2,57 bi em menos de dois meses. A diferença de 0,18 p.p. ao ano é permanente; o risco de um fundo pequeno é temporário. Gatilho de troca: PL acima de R$ 150 mi e spread de tela comparável ao do VWRA11, fazendo a migração por aportes novos, sem vender posição com ganho.<\/p>"}, {"h": "Riscos e gatilhos de revisão", "html": "<ul><li>Concentração em IA: definir limite interno para a exposição aos dez maiores (hoje ~25%).<\/li><li>Real forte com juro alto: o carrego do CDI pesa contra a perna dolarizada enquanto a Selic ficar acima de 13%.<\/li><li>Reabrir o par se o spread de tela do VWRA11 não cair ou se o PL não passar de R$ 300 mi em 12 meses.<\/li><li>Pedir à Investo a correção do índice no FNET e da data de início na lâmina.<\/li><\/ul>"}], "facts": [["Ticker", "VWRA11"], ["Índice", "FTSE All-World"], ["Estrutura", "Feeder do VWRA (Irlanda)"], ["Gestora / adm.", "Investo / BTG Pactual"], ["Taxa total", "0,44% a.a. (0,30 + 0,14)"], ["Patrimônio", "R$ 155,9 mi (08/10)"], ["Cotistas", "9.385"], ["Giro médio", "~R$ 2,8 mi/dia"], ["IR do cotista", "15% sobre ganho"], ["Dividendos", "Reinvestidos"], ["Preço", "R$ 111,67 (13/10)"], ["Retorno 12 meses", "+8,6% (60% do CDI)"]], "factsSrc": "Fonte: FNET/B3, Investo, Vanguard, Yahoo Finance", "strip": [["Preço", "R$ 111,67"], ["12m", "+8,6%"], ["Ano", "+5,0%"], ["Desde 18/09", "−1,4%"], ["Vol. 12m", "12,6%"], ["Queda máx. 12m", "−11,1%"]], "histTitle": "Ações globais em reais nas crises", "histCap": "FTSE All-World (ou VT antes de 2019) convertido pela PTAX", "hist": [["Covid 2020", -22.9, "19/02 a 23/03/2020"], ["Juros globais 2022", -29.1, "jan. a out. 2022"], ["Recessão BR 2015", 17.0, "mai/2015 a jan/2016"], ["Joesley 2017", 8.9, "17 a 18/05/2017"], ["Susto fiscal 2024", 7.2, "25/11 a 18/12/2024"], ["Pós 1º turno (5/10/26)", -4.0, "5/10/2026, real forte"]], "histSrc": "Fonte: Yahoo Finance, BCB (PTAX); cálculo Mercurius", "doc": "1QSndbSr0yBi0T2jM-keJ1h7zsivlKvkI", "gpa": 2.975, "letter": "B+", "perf": {"title": "VWRA11 contra o CDI em 12 meses", "cap": "Base 100 em 13/10/2025, pontos semanais", "bench": "CDI", "pts": [["13 out 25", 100.0, 100.0], ["17 out 25", 99.48, 100.22], ["24 out 25", 100.81, 100.5], ["31 out 25", 100.87, 100.77], ["07 nov 25", 98.83, 101.05], ["14 nov 25", 98.33, 101.33], ["21 nov 25", 98.08, 101.56], ["28 nov 25", 99.99, 101.84], ["05 dez 25", 102.57, 102.12], ["12 dez 25", 101.67, 102.4], ["19 dez 25", 104.09, 102.68], ["26 dez 25", 105.91, 102.91], ["02 jan 26", 103.07, 103.13], ["09 jan 26", 103.78, 103.42], ["16 jan 26", 103.98, 103.7], ["23 jan 26", 102.35, 103.99], ["30 jan 26", 102.29, 104.28], ["06 fev 26", 102.1, 104.57], ["13 fev 26", 101.98, 104.85], ["20 fev 26", 102.12, 105.03], ["27 fev 26", 101.1, 105.32], ["06 mar 26", 99.3, 105.61], ["13 mar 26", 99.29, 105.9], ["20 mar 26", 96.92, 106.19], ["27 mar 26", 94.4, 106.48], ["02 abr 26", 96.11, 106.71], ["10 abr 26", 97.16, 107.0], ["17 abr 26", 100.29, 107.29], ["24 abr 26", 100.16, 107.52], ["30 abr 26", 100.11, 107.76], ["08 mai 26", 101.55, 108.04], ["15 mai 26", 104.07, 108.33], ["22 mai 26", 104.61, 108.62], ["29 mai 26", 106.72, 108.91], ["05 jun 26", 106.26, 109.15], ["12 jun 26", 105.86, 109.44], ["19 jun 26", 110.6, 109.73], ["26 jun 26", 106.93, 110.02], ["03 jul 26", 108.81, 110.31], ["10 jul 26", 108.2, 110.6], ["17 jul 26", 106.64, 110.89], ["24 jul 26", 105.46, 111.18], ["31 jul 26", 106.21, 111.47], ["07 ago 26", 110.2, 111.76], ["14 ago 26", 113.72, 112.05], ["21 ago 26", 111.09, 112.34], ["28 ago 26", 112.47, 112.63], ["04 set 26", 111.79, 112.92], ["11 set 26", 110.25, 113.16], ["18 set 26", 110.48, 113.45], ["25 set 26", 111.94, 113.73], ["02 out 26", 112.31, 114.02], ["09 out 26", 107.6, 114.31], ["13 out 26", 108.55, 114.31]], "src": "Fonte: Yahoo Finance, BCB (CDI)"}}, {"t": "DEBB11", "name": "BTG Pactual Teva Debêntures DI Fundo de Índice", "leg": "Crédito privado", "headline": "prêmio apertado e imposto em disputa", "scores": {"p1": 3.0, "p2": 1.25, "p3": 2.5, "p4": 3.5, "p5": 3.5, "p6": 2.25}, "scoreNotes": {"p1": "Índice amplo de crédito (300+ papéis, teto de 4,5% por emissor), mas faz quase o mesmo trabalho do pós-fixado: correlação de 0,86.", "p2": "Spread mediano das debêntures DI em CDI + 0,93% (9/10), abaixo da média de 12 meses do IDA-DI (1,36%), com recorde de recuperações judiciais.", "p3": "Custo: 0,60% contra 0,50% do GICP11, o ETF de debêntures DI aberto a pessoa física mais barato com mais de um ano (nota 3). IR: 15% pelo regulamento, mas sob risco de 25% desde 21/09 (nota 2, meio-termo até a definição). Média 2,5.", "p4": "BTG Pactual, replicação física, desde 28/06/2022.", "p5": "PL de R$ 1,43 bi e giro médio de R$ 6–8 mi por dia.", "p6": "Queda máxima de 1,2% na série, mas a amostra quase não tem evento de crédito sistêmico. Duration de spread estimada em 2,8 anos."}, "decision": {"l": "Suspender aportes", "tone": "warn"}, "alt": {"t": "MARG11", "why": "Melhor entrega e menor taxa, mas o regulamento restringe o fundo a investidores institucionais isentos de IR.", "gpa": 2.525, "letter": "B"}, "mainIssue": "IR pode ir a 25%; XP suspendeu compras em 21/09", "conf": "Média", "thesis": {"t1": ["ok", "Índice amplo de crédito, 300+ papéis"], "t2": ["at", "GICP11 cobra 0,50%; LTMG11 0,25%"], "t3": ["at", "IR de 15% sob risco de virar 25%"], "t4": ["ok", "R$ 1,43 bi e R$ 6–8 mi/dia"], "t5": ["at", "Duplica o pós-fixado (correlação 0,86)"], "t6": ["at", "Cauda de crédito pouco testada"]}, "lead": "Mantemos a posição, sem novos aportes até a Receita definir o IR. Em 21/09 a XP suspendeu compras do DEBB11 e de outros cinco ETFs de crédito DI, porque eles podem cair na alíquota de 25%, a mesma regra que já pegou os ETFs de LFT. Com 15%, o DEBB11 entrega mais que o LFTS11 depois do imposto; com 25%, a vantagem quase some, e o prêmio de crédito já está apertado.", "sections": [{"h": "Tese: por que essa classe está na carteira", "html": "<p>Debêntures são uma das seis classes do Capital Map. A função é somar um prêmio de crédito ao CDI com diversificação automática: o índice Teva Debêntures DI tem mais de 300 debêntures DI + spread, emissões acima de R$ 300 mi e teto de 4,5% por emissor. Na tese ampla e neutra, é o veículo certo para a classe.<\/p><p>O problema é de papel: crédito DI e pós-fixado têm correlação de 0,86 e, juntos, somavam 40% da carteira proposta para menos de 10% do risco. As duas pernas fazem quase o mesmo trabalho.<\/p>"}, {"h": "Fundamentos: o prêmio que se compra hoje", "html": "<p>A mediana do spread indicativo das 565 debêntures DI + na ANBIMA está em <b>CDI + 0,93%<\/b> (9/10), estável no mês e abaixo da média de 12 meses do IDA-DI, de 1,36%. O spread abriu entre março e abril e voltou a fechar. Ao mesmo tempo, 2025 e 2026 tiveram Raízen, Braskem, Ambipar, Banco Master e Casas Bahia, mais de 6.300 empresas em recuperação judicial e saída estimada de R$ 96 bi dos fundos de crédito no primeiro semestre.<\/p><p>Desde o lançamento, o DEBB11 rendeu <b>13,5% ao ano contra 13,2% do CDI<\/b> (103% do CDI), ou cerca de CDI + 0,4% líquido. Em 12 meses ficou em 96% do CDI, abaixo dos 99,4% do LFTS11. O spread bruto da carteira gira em torno de 1 ponto e a taxa de 0,60% leva cerca de 60% dele.<\/p>"}, {"h": "Veículo: custo, estrutura e imposto", "html": "<p>Taxa global de 0,60% ao ano, sem custódia. Contra o prêmio que a carteira paga hoje, cerca de 1 ponto sobre o CDI, é cara. Replicação física, BTG Pactual na gestão e na administração, patrimônio de R$ 1,43 bi e 24,5 mil cotistas.<\/p><p>O IR segue a tabela dos ETFs de renda fixa (Lei 13.043/2014), com faixa definida pelo prazo médio de repactuação da carteira. Até setembro, o mercado tratava o DEBB11 como 15%. Por R$ 100 de CDI, depois de taxa e imposto, sobram cerca de <b>R$ 87 com 15%<\/b> e <b>R$ 77 com 25%<\/b>; o LFTS11 deixa R$ 74.<\/p>"}, {"h": "O imposto em disputa", "html": "<p>Em 2024 o Tesouro passou a tratar a LFT como papel que se reprecifica todo dia, e os ETFs de Selic caíram para a faixa de 25%. A mesma lógica pode valer para debêntures que pagam CDI + spread. Em <b>21/09/2026 a XP suspendeu novas compras e transferências<\/b> de DEBB11, MARG11, LFIN11, AMAB11, GICP11 e NLFA11; posições existentes não foram afetadas. Em 22/09 a ANBIMA defendeu 15% para papéis que se reprecificam em mais de 720 dias, e a imprensa citou risco de cobrança retroativa.<\/p><p>Até 13/10 não há ato da Receita, do Tesouro ou da CVM, nem fato relevante dos emissores sobre mudança de faixa. A curadoria da Stop Loss tirou todos os ETFs de crédito DI da lista até a definição. A nossa posição é a mesma para aportes novos: <b>esperar<\/b>. Vender agora realiza ganho sem saber a alíquota.<\/p>"}, {"h": "Alternativa: MARG11", "html": "<p>O MARG11 replica o Índice de Debêntures Ultra Qualidade DI B3 (só AAA), cobra 0,50% e entregou 102% do CDI em 12 meses com metade da oscilação. Mas o regulamento restringe o público a <b>instituições financeiras, fundos e previdência isentos de IR<\/b>, e um único cotista tem 22,75% do fundo. Para clientes pessoa física, não é uma opção. Rating do MARG11: B (2,53), barrado pelo público-alvo e com o mesmo risco de IR.<\/p>"}, {"h": "Riscos e gatilhos de revisão", "html": "<ul><li>Gatilho principal: decisão da Receita sobre a faixa de IR dos ETFs de crédito DI. Com 25%, rever a perna inteira.<\/li><li>Teto sugerido: crédito somado ao pós-fixado até 30% da carteira enquanto o spread estiver abaixo da média de 12 meses.<\/li><li>Rever se o spread mediano voltar a CDI + 1,3% ou mais: aí o prêmio paga a taxa com folga.<\/li><li>Mapear a exposição do índice a emissores em reestruturação (Raízen, Ambipar, Braskem) na próxima carteira do FNET.<\/li><li>Concorrentes abertos a pessoa física e mais baratos: GICP11 (0,50%) e LTMG11 (0,25%, lançado em 01/10/2026). Os de letras financeiras (LFIN11, NLFA11, LFIX11) têm outro risco: só bancos.<\/li><\/ul>"}], "facts": [["Ticker", "DEBB11"], ["Índice", "Teva Debêntures DI"], ["Estrutura", "Replicação física"], ["Gestora / adm.", "BTG Pactual / BTG Pactual"], ["Taxa global", "0,60% a.a."], ["Patrimônio", "R$ 1,43 bi (08/10)"], ["Cotistas", "24.545"], ["Giro médio", "R$ 6–8 mi/dia"], ["IR do cotista", "15% hoje; risco de 25%"], ["Rendimentos", "Reinvestidos"], ["Preço", "R$ 17,24 (13/10)"], ["Desde o início", "13,5% a.a. (103% do CDI)"]], "factsSrc": "Fonte: FNET/B3, regulamento BTG Pactual, ANBIMA, Yahoo Finance", "strip": [["Preço", "R$ 17,24"], ["12m", "+13,8% (96% CDI)"], ["Ano", "+10,9%"], ["Desde 18/09", "+0,5%"], ["Vol. 12m", "1,5%"], ["Spread de mercado", "CDI + 0,93%"]], "histTitle": "Quanto o DEBB11 perde com spread e default", "histCap": "Simulação instantânea pelo motor de stress (duration de spread de 2,8 anos)", "hist": [["Spread +50 bp", -1.4, "Abertura moderada"], ["Spread +100 bp", -2.8, "Similar a março–abril de 2026"], ["Spread +200 bp", -5.6, "Recessão convencional"], ["Spread +300 bp e 2% de default", -10.4, "Cauda: recessão por automação"]], "histSrc": "Fonte: cálculo Mercurius", "doc": "1SEqTMxRYCp0mvlQQPB-VDgIMECTBAZTw", "gpa": 2.575, "letter": "B", "perf": {"title": "DEBB11 contra o CDI em 12 meses", "cap": "Base 100 em 13/10/20 /* ---------- Charts ---------- */
function lineChart(perf) {
  const pts = perf.pts; if (!pts || pts.length < 2) return "";
  const W = 400, H = 220, L = 34, R = 10, T = 12, B = 26;
  const ys = pts.flatMap(p => [p[1], p[2]]).filter(v => v != null);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
  const X = i => L + i / (pts.length - 1) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const step = (y1 - y0) > 40 ? 10 : (y1 - y0) > 16 ? 5 : (y1 - y0) > 6 ? 2 : 1, ticks = [];
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) ticks.push(v);
  const path = k => pts.map((p, i) => p[k] == null ? null : `${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).filter(Boolean).join(" L");
  const last = pts[pts.length - 1], n = pts.length - 1;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Desempenho indexado contra ${esc(perf.bench)}">`;
  ticks.forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`; });
  [0, Math.floor(n / 2), n].forEach(i => { s += `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === n ? "end" : "middle"}" font-size="10" fill="var(--muted)">${esc(pts[i][0])}</text>`; });
  s += `<path d="M${path(2)}" fill="none" stroke="var(--s1)" stroke-width="2"/><path d="M${path(1)}" fill="none" stroke="var(--s2)" stroke-width="2"/>`;
  s += `<circle cx="${X(n)}" cy="${Y(last[1])}" r="3.5" fill="var(--s2)" stroke="var(--warm)" stroke-width="1.5"/>`;
  if (last[2] != null) s += `<circle cx="${X(n)}" cy="${Y(last[2])}" r="3.5" fill="var(--s1)" stroke="var(--warm)" stroke-width="1.5"/>`;
  s += `<line class="xh" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-dasharray="2 3" visibility="hidden"/><rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  return s;
}
function bindLine(el, perf, name) {
  const svg = el.querySelector("svg"); if (!svg) return;
  const pts = perf.pts, W = 400, L = 34, R = 10, hit = svg.querySelector(".hit"), xh = svg.querySelector(".xh");
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((x - L) / (W - L - R) * (pts.length - 1))));
    const px = L + i / (pts.length - 1) * (W - L - R);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    showTip(`<b>${esc(pts[i][0])}</b><br>${esc(name)}: ${nf(pts[i][1], 1)}<br>${esc(perf.bench)}: ${nf(pts[i][2], 1)}`, ev);
  });
  hit.addEventListener("mouseleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}
function hbars(items, o) {
  const max = o.max != null ? o.max : Math.max(...items.map(i => Math.abs(i[1])), 1);
  const min = o.min != null ? o.min : Math.min(0, ...items.map(i => i[1]));
  const span = max - min, zx = (0 - min) / span * 100;
  return `<div class="bars">${items.map(it => { const v = it[1], a = (Math.min(v, 0) - min) / span * 100, b = (Math.max(v, 0) - min) / span * 100;
    return `<div class="brow" data-tip="${esc(it[2] || "")}"><span>${esc(it[0])}</span><span class="tr"><span class="fl" style="left:${a}%;width:${Math.max(b - a, 0.6)}%;background:${o.color(v)}"></span>${min < 0 ? `<span class="zero" style="left:${zx}%"></span>` : ""}</span><span class="v">${o.fmt(v)}</span></div>`; }).join("")}</div>`;
}

/* ---------- Stress lab ---------- */
const SX = D.stress;
function ret(a, f, H) {
  const m = a.m, h = H / 12, fee = (m.fee || 0) / 100 * h, cdi = f.cdi / 100, ipca = f.ipca / 100;
  let P = 0, C = 0;
  if (m.type === "usd_eq") P = (1 + m.beq * f.eq / 100) * (1 + f.fx / 100) - 1;
  else if (m.type === "br_eq") P = m.bibov * f.ibov / 100;
  else if (m.type === "gold") P = (1 + f.gold / 100) * (1 + f.fx / 100) - 1;
  else if (m.type === "credit") { P = -m.sd * f.dcred / 1e4 - f.dflt / 100; C = Math.pow((1 + cdi) * (1 + m.spr / 100), h) - 1; }
  else if (m.type === "lft") { P = -m.sd * f.dlft / 1e4; C = (Math.pow(1 + cdi, h) - 1) * m.pct; }
  else if (m.type === "ntnb") { P = -m.dur * f.dreal / 100; C = Math.pow((1 + ipca) * (1 + m.ry / 100), h) - 1; }
  return { P: P * 100, C: C * 100, T: ((1 + P) * (1 + C) - 1 - fee) * 100 };
}
function runScenario(p, w) {
  const tot = SX.assets.reduce((s, a) => s + (w[a.t] || 0), 0) || 1;
  let I = 0, T = 0; const by = [];
  SX.assets.forEach(a => { const wt = (w[a.t] || 0) / tot, r0 = ret(a, p.v, 0), r = ret(a, p.v, p.v.H); I += wt * r0.T; T += wt * r.T; by.push({ t: a.t, label: a.label, w: wt, P: r0.T, T: r.T, c: wt * r0.T }); });
  by.sort((x, y) => x.c - y.c);
  return { I, T, by };
}

    <div class="tbl"><table class="st heat" style="min-width:900px"><thead><tr><th>Ativo</th>${M.heat.days.map(d => `<th>${esc(d.slice(0, 6))}</th>`).join("")}</tr></thead>
      <tbody>${M.heat.rows.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(v => `<td style="background:${heatColor(v, RF[r[0]])}">${nf(v, 2)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <h4 class="eyebrow" style="margin-top:24px">Regras de alerta</h4><ul class="note" style="padding-left:18px"><li>${esc(M.rules.rv)}</li><li>${esc(M.rules.rf)}</li><li>${esc(M.rules.port)}</li></ul>
  </section>`;
  const svg = $("#bc svg"), hit = svg.querySelector(".hit"), xh = svg.querySelector(".xh"), n = M.series.length - 1, W = 760, L = 40, R = 14;
  hit.addEventListener("mousemove", ev => { const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W; const i = Math.max(0, Math.min(n, Math.round((x - L) / (W - L - R) * n))); const px = L + i / n * (W - L - R); xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible"); const p = M.series[i]; showTip(`<b>${esc(p[0])}</b><br>Carteira ${nf(p[1], 2)}<br>CDI ${nf(p[2], 2)}`, ev); });
  hit.addEventListener("mouseleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}

    ${R.alert ? `<div class="answer" style="margin-bottom:28px"><p class="eyebrow">${esc(R.alert.k)}</p><h3>${esc(R.alert.h)}</h3><p>${esc(R.alert.t)}</p></div>` : ""}
    ${radarRank(R)}
    <div class="cards" style="grid-template-columns:1fr">${R.items.map(it => `

        <div class="verdict"><span class="tag ${it.tone}">${esc(it.verdict)}</span></div>
        ${(it.grades || []).length ? `<div class="rg">${it.grades.map(g => `<div class="rgi"><span class="grade">${g.letter}</span><div><b>${esc(g.t)}</b> <span class="num">${nf(g.gpa, 2)}</span>${g.prov ? ` <span class="prov">provisória</span>` : ""}<p>${esc(g.why)}</p><div class="pl">${D.pillars.map(p => `<span>${esc(p.s)} <b>${nf(g.s[p.k], 2)}</b></span>`).join("")}</div></div></div>`).join("")}</div>` : ""}
        <p style="margin:6px 0 0;color:var(--ink-2)">${esc(it.take)}</p>
        <div class="two" style="gap:28px;margin-top:10px">
          <table class="dt">${it.facts.map(f => `<tr><td>${esc(f[0])}</td><td>${esc(f[1])}</td></tr>`).join("")}</table>
          <div>${it.pros && it.pros.length ? `<p class="eyebrow" style="margin-top:4px">A favor</p><ul style="margin:0 0 10px;padding-left:18px;font-size:14.5px">${it.pros.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
            ${it.cons && it.cons.length ? `<p class="eyebrow">Contra</p><ul style="margin:0;padding-left:18px;font-size:14.5px">${it.cons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>
        </div>

    ${univHTML()}
    ${R.extra ? `<h3 class="sec-title" style="margin-top:44px;font-size:28px">${esc(R.extra.h)}</h3><p class="sec-lede">${esc(R.extra.lede)}</p>
      <div class="tbl"><table class="mt"><thead><tr>${R.extra.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${R.extra.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;
}

/* ---------- Radar ranking ---------- */
function refGrade(name) {
  const e = D.etfs.find(x => name.startsWith(x.t)); if (e) return `${e.t} <span class="grade sm">${e.letter}</span> ${nf(e.gpa, 2)}`;
  const g = (D.radar.radarGrades || []).find(x => name.startsWith(x.t)); if (g) return `${g.t} <span class="grade sm">${g.letter}</span> ${nf(g.gpa, 2)}`;
  return esc(name);
}
function radarRank(R) {
  const G = R.radarGrades || []; if (!G.length) return "";
  return `<h3 class="sec-title" style="font-size:28px">Notas do radar</h3>
    <p class="sec-lede">Mesmos seis pilares e mesmas âncoras da carteira. "Provisória" quando o fundo tem menos de um ano ou falta dado; a nota tende a mudar com o histórico.</p>
    ${gradeLegend()}
    <div class="tbl"><table class="rt" style="cursor:default"><thead><tr><th>ETF</th><th>Rating</th><th class="r">Nota 0–4</th>${D.pillars.map(p => `<th class="r">${esc(p.s)}</th>`).join("")}<th>Compara com</th></tr></thead>
    <tbody>${G.map(g => `<tr style="cursor:default"><td><span class="tk">${esc(g.t)}</span>${g.prov ? `<span class="sub">nota provisória</span>` : ""}</td><td><span class="grade">${g.letter}</span></td><td class="r num">${nf(g.gpa, 2)}</td>${D.pillars.map(p => `<td class="r num" style="font-weight:400">${nf(g.s[p.k], 1)}</td>`).join("")}<td>${refGrade(g.compareTo)}</td></tr>`).join("")}</tbody></table></div>
    <div style="height:36px"></div>`;
}

/* ---------- Universe ---------- */
const UV = { v: "all", via: "all" };
const UVL = { ok: ["Passa", "good"], at: ["Com ressalva", "warn"], no: ["Fora da tese", "crit"] };
function univHTML() {
  const U = D.universe; if (!U) return "";
  const chip = (k, val, lab) => `<button class="uchip${UV[k] === val ? " on" : ""}" data-k="${k}" data-v="${val}">${esc(lab)}</button>`;
  const rows = g => g.rows.filter(r => (UV.v === "all" || r[6] === UV.v) && (UV.via === "all" || r[2] === UV.via));
  return `<div id="univ"><h3 class="sec-title" style="margin-top:48px;font-size:28px">Universo de ETFs</h3>
    <p class="sec-lede">${esc(U.lead)}</p>
    <div class="ukpi"><div><b>${U.count.rows}</b><span>linhas avaliadas</span></div><div><b style="color:var(--good)">${U.count.ok}</b><span>passam</span></div><div><b style="color:var(--warn)">${U.count.at}</b><span>com ressalva</span></div><div><b style="color:var(--crit)">${U.count.no}</b><span>fora da tese</span></div></div>
    <div class="unotes">${U.notes.map(n => `<div><h4>${esc(n[0])}</h4><p>${esc(n[1])}</p></div>`).join("")}</div>
    <div class="ufil"><span>Triagem</span>${chip("v", "all", "Todos")}${chip("v", "ok", "Passa")}${chip("v", "at", "Com ressalva")}${chip("v", "no", "Fora da tese")}
      <span style="margin-left:14px">Via</span>${chip("via", "all", "Todas")}${chip("via", "ETF B3", "ETF B3")}${chip("via", "BDR", "BDR")}${chip("via", "Exterior", "Exterior")}</div>
    ${U.groups.map(g => { const rs = rows(g); return rs.length ? `<h4 class="ugh">${esc(g.h)} <span>${esc(g.role)}</span></h4>
      <div class="tbl"><table class="mt" style="min-width:860px"><thead><tr><th>Ticker</th><th>Índice</th><th>Via</th><th>Custo</th><th>Tamanho</th><th>Imposto</th><th>Triagem</th><th>Motivo</th></tr></thead><tbody>
      ${rs.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="num" style="font-weight:400">${esc(r[3])}</td><td class="num" style="font-weight:400">${esc(r[4])}</td><td>${esc(r[5])}</td><td><span class="tag ${UVL[r[6]][1]}">${UVL[r[6]][0]}</span></td><td>${esc(r[7])}</td></tr>`).join("")}</tbody></table></div>` : ""; }).join("")}
    <p class="src">${esc(U.src)}</p></div>`;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest(".uchip"); if (!b) return;
  UV[b.dataset.k] = b.dataset.v; const el = document.getElementById("univ");
  if (el) el.outerHTML = univHTML();
});

$("#disc").textContent = D.disclaimer;

})();

/* ---------- Cores das notas: A verde, B azul, C amarelo, D laranja, F vermelho ---------- */
function paintGrades(root) {
  root.querySelectorAll(".grade, .lg, .feat-score .g, .rbadge .g, .pk small, .feat-score .ladder span, .gl").forEach(el => { if (!el.dataset.g) { const g = el.textContent.trim().replace("-", "−"); if (/^[A-DF][+−]?$/.test(g)) el.dataset.g = g; } });
}
function gradeLegend() { return `<div class="glegend">${["A+", "A", "A−", "B+", "B", "B−", "C+", "C", "C−", "D", "F"].map(l => `<span class="grade gl">${l}</span>`).join("")}</div>`; }

/* ---------- Mobile: tabelas viram cartões ---------- */
function stackTables(root) {
  root.querySelectorAll("table.rt, table.mt, table.st:not(.heat)").forEach(t => {
    const hs = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (!hs.length) return;
    t.classList.add("stk");
    t.querySelectorAll("tbody tr").forEach(tr => [...tr.children].forEach((td, i) => {
      if (td.hasAttribute("colspan") || td.dataset.l !== undefined) return;
      td.dataset.l = hs[i] || "";
      const cv = document.createElement("span"); cv.className = "cv";
      while (td.firstChild) cv.appendChild(td.firstChild);
      td.appendChild(cv);
    }));
  });
}
let stkQ = 0;
new MutationObserver(() => { if (!stkQ) stkQ = requestAnimationFrame(() => { stkQ = 0; stackTables(document.body); paintGrades(document.body); }); }).observe(document.body, { childList: true, subtree: true });
stackTables(document.body);
paintGrades(document.body);

</script>
