<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Cobertura de ETFs Mercurius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: the official Mercurius research portal. White nav with the logo, breadcrumb, dark hero with bronze line art, dark section bar that switches views, then white pages built from warm cards, bronze eyebrows and light condensed headlines. */
:root {
  --bg: #ffffff;
  --warm: #faf8f2;
  --warm-2: #f3efe5;
  --ink: #31373d;
  --ink-2: #5b6168;
  --muted: #6a7076;
  --bronze-dk: #c69c76;
  --rule: #e4dfd4;
  --rule-strong: #cfc8ba;
  --bronze: #936846;
  --teal: #1a7b99;
  --teal-ink: #ffffff;
  --link: #2670a9;
  --hero: #262b30;
  --bar: #31373d;
  --on-dark: #f3f1ec;
  --on-dark-2: #b9bdc2;
  --s1: #0b7ea3;
  --s2: #b0702a;
  --s3: #5b4f9e;
  --good: #2b7a3d;
  --warn: #9a6400;
  --crit: #b23a35;
  --font-head: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", Arial, Helvetica, sans-serif;
  --logo-dark: block;
  --logo-light: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16191c; --warm: #1f2327; --warm-2: #262b30; --ink: #e9e6df; --ink-2: #b7b4ad; --muted: #8b8f94;
    --rule: #33383d; --rule-strong: #464c52; --bronze: #c69c76; --teal: #2a8fb0; --teal-ink: #ffffff; --link: #6aaee0;
    --hero: #0f1214; --bar: #22272c; --bronze-dk: #c69c76; --on-dark: #f3f1ec; --on-dark-2: #a9aeb3;
    --s1: #2a9cc6; --s2: #c07f35; --s3: #8a7fd6; --good: #5dbb72; --warn: #e0a43a; --crit: #ec6f6c;
    --logo-dark: none; --logo-light: block;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16191c; --warm: #1f2327; --warm-2: #262b30; --ink: #e9e6df; --ink-2: #b7b4ad; --muted: #8b8f94;
  --rule: #33383d; --rule-strong: #464c52; --bronze: #c69c76; --teal: #2a8fb0; --teal-ink: #ffffff; --link: #6aaee0;
  --hero: #0f1214; --bar: #22272c; --bronze-dk: #c69c76; --on-dark: #f3f1ec; --on-dark-2: #a9aeb3;
  --s1: #2a9cc6; --s2: #c07f35; --s3: #8a7fd6; --good: #5dbb72; --warn: #e0a43a; --crit: #ec6f6c;
  --logo-dark: none; --logo-light: block;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
a { color: var(--link); font-weight: 500; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 32px; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 300; letter-spacing: .3px; color: var(--ink); text-wrap: balance; }
.eyebrow { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--bronze); margin: 0 0 10px; }

/* Nav */
.nav .wrap { display: flex; justify-content: space-between; align-items: center; padding-block: 16px 10px; gap: 16px; }
.mark { display: inline-block; line-height: 0; }
.mark img { height: 46px; width: auto; max-width: 100%; }
.mark .on-light { display: var(--logo-dark); }
.mark .on-dark { display: var(--logo-light); }
.nav-r { font-size: 12px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--ink-2); font-weight: 500; text-align: right; }
@media (max-width: 480px) { .mark img { height: 36px; } .nav-r { display: none; } }
.crumbs { font-size: 13.5px; color: var(--muted); padding-block: 6px 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.crumbs b { color: var(--ink); font-weight: 500; }

/* Hero */
.hero { position: relative; background: var(--hero); color: var(--on-dark); overflow: hidden; }
.hero svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .wrap { position: relative; padding-block: 52px 46px; }
.hero h1 { color: var(--on-dark); font-size: clamp(34px, 5vw, 52px); line-height: 1.08; margin: 0; max-width: 16ch; }
.hero p { color: var(--on-dark-2); font-size: 15.5px; max-width: 52ch; margin: 16px 0 0; }
.hero .eyebrow, .rhead .eyebrow, .answer .eyebrow { color: var(--bronze-dk); }
.hbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--on-dark); display: grid; grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid rgba(255,255,255,.08); }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding-left: 20px; }
.tab { font: inherit; font-size: 14px; color: var(--on-dark-2); background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 16px 11px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--on-dark); }
.tab[aria-selected="true"] { color: var(--on-dark); border-bottom-color: var(--bronze); }
.hbar a.cta { display: flex; align-items: center; gap: 10px; padding: 14px 32px; color: var(--on-dark); text-decoration: none; font-size: 13px; letter-spacing: 2.2px; font-weight: 600; text-transform: uppercase; white-space: nowrap; border-left: 1px solid rgba(255,255,255,.12); }
.hbar a.cta:hover { background: rgba(255,255,255,.06); }
@media (max-width: 760px) { .hbar { grid-template-columns: 1fr; } .hbar a.cta { display: none; } .tabs { padding-left: 4px; } }
.view[hidden] { display: none !important; }

section.blk { padding-block: 56px 0; }
.sec-title { font-size: clamp(28px, 3.4vw, 36px); margin: 0 0 8px; }
.sec-lede { color: var(--ink-2); max-width: 66ch; margin: 0 0 26px; }

/* Featured decision block */
.feat { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 52px; align-items: stretch; }
@media (max-width: 880px) { .feat { grid-template-columns: 1fr; gap: 28px; } }
.feat-score { background: var(--hero); color: var(--on-dark); padding: 30px 30px 28px; display: grid; align-content: space-between; gap: 22px; position: relative; overflow: hidden; }
.feat-score svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.feat-score > * { position: relative; }
.feat-score .k { font-size: 13px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--bronze-dk); }
.feat-score .g { font-family: var(--font-head); font-weight: 300; font-size: 108px; line-height: .9; }
.feat-score .gs { font-family: var(--font-head); font-size: 22px; font-weight: 300; color: var(--on-dark-2); }
.feat-score .m { font-size: 15px; color: var(--on-dark); max-width: 34ch; }
.feat-score .ladder { display: flex; gap: 3px; flex-wrap: wrap; }
.feat-score .ladder span { font-size: 12px; font-weight: 600; padding: 3px 7px; color: var(--on-dark-2); border: 1px solid rgba(255,255,255,.18); }
.feat-score .ladder span.on { background: var(--bronze); color: #fff; border-color: var(--bronze); }
.feat h3 { font-size: clamp(26px, 3.2vw, 34px); line-height: 1.2; margin: 0 0 14px; }
.date { font-size: 14px; color: var(--ink-2); margin: 0 0 14px; font-weight: 500; }
.feat p.s { color: var(--ink-2); font-size: 15.5px; margin: 0 0 18px; }
.btn { display: inline-block; background: var(--teal); color: var(--teal-ink); text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 2.2px; text-transform: uppercase; padding: 13px 34px; border: 1.5px solid var(--teal); cursor: pointer; font-family: var(--font-body); }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--teal); }
.btnrow { display: flex; gap: 12px; flex-wrap: wrap; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
.card { display: grid; grid-template-columns: 112px minmax(0, 1fr); background: var(--warm); min-width: 0; }
.card .thumb { background: var(--hero); position: relative; }
.card .thumb svg { width: 100%; height: 100%; display: block; }
.card .thumb .lg { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: var(--font-head); font-size: 30px; font-weight: 600; color: #f3f1ec; }
.card .body { padding: 18px 20px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card .eyebrow { margin: 0; font-size: 12.5px; }
.card h3 { font-size: 21px; line-height: 1.3; margin: 0; font-weight: 400; }
.card h3 .tk { font-weight: 600; }
.card .verdict { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.card .more { justify-self: start; margin-top: 4px; background: none; border: 0; padding: 0 0 3px; border-bottom: 2px solid var(--link); color: var(--link); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.card .more:hover { color: var(--ink); border-color: var(--ink); }
@media (max-width: 420px) { .card { grid-template-columns: 84px minmax(0, 1fr); } }

.ukpi { display: flex; flex-wrap: wrap; gap: 28px; margin: 4px 0 22px; }
.ukpi div { display: flex; flex-direction: column; } .ukpi b { font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1; } .ukpi span { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-top: 4px; }
.unotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 28px; margin: 0 0 26px; }
.unotes h4 { margin: 0 0 4px; font-size: 15px; } .unotes p { margin: 0; font-size: 14px; color: var(--ink-2); }
.ufil { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 8px; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
.uchip { font: inherit; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--ink); background: transparent; border: 1px solid var(--rule-strong); padding: 5px 11px; cursor: pointer; }
.uchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ugh { margin: 26px 0 8px; font-size: 18px; } .ugh span { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }

/* Page reset (fora do Claude o navegador aplica margem padrão) */
html, body { margin: 0; padding: 0; }


/* Grade colors (fill = --gc/--gt on light badges; --gd = tint legível sobre fundo escuro) */
[data-g="A+"] { --gc: #0f5c2e; --gt: #fff; --gd: #4fd17e; }
[data-g="A"]  { --gc: #1c7a3c; --gt: #fff; --gd: #6fd894; }
[data-g="A−"] { --gc: #2e8f4c; --gt: #fff; --gd: #98e2b1; }
[data-g="B+"] { --gc: #17467f; --gt: #fff; --gd: #6ea8ec; }
[data-g="B"]  { --gc: #2563a8; --gt: #fff; --gd: #8dbcf1; }
[data-g="B−"] { --gc: #3b7cc2; --gt: #fff; --gd: #b0d0f6; }
[data-g="C+"] { --gc: #b88700; --gt: #1d1600; --gd: #f0c040; }
[data-g="C"]  { --gc: #d6a91a; --gt: #1d1600; --gd: #f4cf66; }
[data-g="C−"] { --gc: #e8c75a; --gt: #1d1600; --gd: #f8e19a; }
[data-g="D"]  { --gc: #c9621a; --gt: #fff; --gd: #f5a25a; }
[data-g="F"]  { --gc: #b3302a; --gt: #fff; --gd: #f2847c; }
.grade[data-g] { background: var(--gc); color: var(--gt); }
.lg[data-g], .feat-score .g[data-g], .rbadge .g[data-g] { color: var(--gd); }
.feat-score .ladder span[data-g] { color: var(--gd); border-color: color-mix(in srgb, var(--gd) 45%, transparent); }
.feat-score .ladder span.on[data-g] { background: var(--gc); color: var(--gt); border-color: var(--gc); }
.pk small[data-g] { color: var(--gc); font-weight: 700; }
.glegend { display: flex; flex-wrap: wrap; gap: 4px; margin: -8px 0 20px; }
.glegend .grade { min-width: 34px; height: 24px; font-size: 13px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pk small[data-g] { color: var(--gd); } }
:root[data-theme="dark"] .pk small[data-g] { color: var(--gd); }

/* Radar grades */
.grade.sm { min-width: 30px; height: 22px; font-size: 13px; padding: 0 6px; vertical-align: middle; }
.rg { display: grid; gap: 14px; margin: 14px 0 6px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.rgi { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.rgi p { margin: 4px 0 6px; font-size: 14px; color: var(--ink-2); }
.rgi .num { color: var(--muted); }
.rgi > .grade { justify-self: start; }
.rgi .pl { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.rgi .pl b { color: var(--ink); font-weight: 600; }
.prov { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--warn); font-weight: 600; margin-left: 6px; }

/* Mobile */
.rside > * { min-width: 0; }
.heat td:first-child, .heat th:first-child { position: sticky; left: 0; background: var(--bg); z-index: 1; }
@media (max-width: 760px) {
  .tabs { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
}
@media (max-width: 640px) {
  .tbl table.stk { min-width: 0 !important; width: 100%; border-top: 0; }
  .stk thead { display: none; }
  .stk, .stk tbody { display: block; }
  .stk tr { display: block; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin: 0 0 14px; padding: 4px 0 6px; }
  .stk tr[hidden] { display: none; }
  .stk tr.sdet { border-top: 0; margin-top: -14px; }
  .stk td { display: grid; grid-template-columns: minmax(96px, 38%) minmax(0, 1fr); gap: 10px; padding: 7px 2px !important; border-bottom: 1px solid var(--rule); text-align: left !important; white-space: normal; }
  .stk td:last-child { border-bottom: 0; }
  .stk td .cv { min-width: 0; }
  .stk td::before { content: attr(data-l); font-size: 11px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
  .stk td:first-child { display: block; padding-top: 10px !important; border-bottom: 1px solid var(--rule); }
  .stk td:first-child::before { content: none; }
  .stk td[colspan] { display: block; }
  .stk td[colspan]::before { content: none; }
  .stk td[data-l=""]::before { content: none; }
  .stk td[data-l=""] { display: block; }
  .kpis { grid-template-columns: 1fr 1fr !important; gap: 10px; }
  .kpis > div { padding: 12px 12px; }
  .kpis .v { font-size: 28px; }
  .rside { padding: 18px 16px 20px; }
  .rside .tbl .dt { min-width: 0 !important; font-size: 12.5px; }
  .rside .tbl .dt td { padding-left: 4px; }
  .rgi { grid-template-columns: 1fr; gap: 6px; }
  .ukpi { gap: 18px; } .ukpi b { font-size: 28px; }
}
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tag.good { color: var(--good); } .tag.warn { color: var(--warn); } .tag.crit { color: var(--crit); } .tag.info { color: var(--teal); }
.mk { display: inline-grid; place-items: center; width: 20px; height: 20px; font-size: 11px; font-weight: 700; }
.mk.ok { background: var(--good); color: #fff; } .mk.at { background: var(--warn); color: #fff; } .mk.no { background: var(--crit); color: #fff; }
.grade { display: inline-grid; place-items: center; min-width: 40px; height: 30px; padding: 0 8px; font-family: var(--font-head); font-weight: 600; font-size: 18px; background: var(--hero); color: var(--on-dark); }

/* Tables */
.tbl { overflow-x: auto; }
.rt { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 14px; border-top: 2px solid var(--ink); }
.rt th { text-align: left; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 13px 12px 11px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
.rt td { padding: 14px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.rt tbody tr { cursor: pointer; }
.rt tbody tr:hover td { background: var(--warm); }
.rt .r { text-align: right; }
.rt .tk { font-family: var(--font-head); font-weight: 600; font-size: 18px; }
.rt .sub { display: block; font-size: 12.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--ink-2); margin-top: 14px; align-items: center; }
.legend span { display: inline-flex; gap: 7px; align-items: center; }
.mt { width: 100%; border-collapse: collapse; font-size: 14px; border-top: 2px solid var(--ink); }
.mt th { text-align: left; font-size: 11.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 11px 10px; border-bottom: 1px solid var(--rule-strong); }
.mt td { padding: 11px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.sev { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

/* Lists of warm items */
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .acts { grid-template-columns: 1fr; } }
.act { background: var(--warm); padding: 20px 22px; display: grid; gap: 6px; align-content: start; }
.act .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.act .n { font-family: var(--font-head); font-size: 30px; font-weight: 300; color: var(--bronze); line-height: 1; }
.act h4 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 400; }
.act p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.changes { columns: 2 340px; column-gap: 32px; margin: 0; padding: 0; list-style: none; }
.changes li { break-inside: avoid; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--ink-2); }

/* Report page (one-pager) */
.picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 28px 0 18px; }
.pk { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 14px; border: 1px solid var(--rule-strong); background: var(--bg); color: var(--ink); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.pk small { font-weight: 500; color: var(--muted); }
.pk[aria-pressed="true"] { background: var(--hero); color: var(--on-dark); border-color: var(--hero); }
.pk[aria-pressed="true"] small { color: var(--on-dark-2); }
.pk[aria-pressed="true"] small[data-g] { color: var(--gd); }
.rhead { background: var(--hero); color: var(--on-dark); position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; padding: 30px 32px; }
.rhead svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rhead > div { position: relative; min-width: 0; }
.rhead h2 { color: var(--on-dark); font-size: clamp(28px, 3.8vw, 42px); line-height: 1.12; margin: 4px 0 8px; }
.rhead .sub { color: var(--on-dark-2); font-size: 14.5px; }
.rbadge { text-align: right; }
.rbadge .g { font-family: var(--font-head); font-weight: 300; font-size: 76px; line-height: .9; color: var(--on-dark); }
.rbadge .s { font-size: 14px; color: var(--on-dark-2); margin-top: 6px; }
.rbadge .tag { margin-top: 8px; }
.rbadge .tag.good { color: #8fd19e; } .rbadge .tag.warn { color: #f0c068; } .rbadge .tag.crit { color: #f09a96; }
@media (max-width: 640px) { .rhead { grid-template-columns: 1fr; padding: 22px 16px; } .rbadge { text-align: left; } }
.rstrip { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 12px 32px; background: var(--warm-2); font-size: 13.5px; color: var(--ink-2); border-bottom: 3px solid var(--bronze); }
.rstrip b { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .rstrip { padding: 12px 16px; } }
.rbody { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 44px; padding-top: 32px; }
@media (max-width: 920px) { .rbody { grid-template-columns: 1fr; gap: 28px; } }
.rmain { min-width: 0; }
.lead { font-family: var(--font-head); font-size: 23px; font-weight: 400; line-height: 1.38; color: var(--ink); margin: 0 0 22px; }
.rmain h3, .prose h3 { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--bronze); margin: 26px 0 8px; }
.rmain p, .prose p { margin: 0 0 12px; color: var(--ink); font-size: 16px; }
.rmain p b, .prose p b { font-weight: 600; }
.rmain ul, .prose ul { margin: 0 0 12px; padding-left: 20px; }
.rmain li, .prose li { margin-bottom: 6px; }
.rside { background: var(--warm); padding: 22px 22px 24px; min-width: 0; align-self: start; display: grid; gap: 24px; }
.rside h4 { font-family: var(--font-head); font-size: 20px; font-weight: 400; margin: 0 0 2px; }
.rside h4 .n { color: var(--bronze); font-weight: 600; }
.cap { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.src { font-size: 12px; color: var(--muted); margin: 8px 0 0; font-style: italic; }
.dt { width: 100%; border-collapse: collapse; font-size: 14px; }
.dt td { padding: 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.dt td:last-child { text-align: right; font-weight: 600; padding-left: 12px; }
.dt tr:last-child td { border-bottom: 0; }
.rfoot { font-size: 12px; color: var(--muted); padding: 22px 0 0; margin-top: 28px; border-top: 1px solid var(--rule); }

/* Charts */
.chart { width: 100%; max-width: 520px; height: auto; display: block; }
.chart text { font-family: var(--font-body); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 6px; }
.keys span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 10px; height: 10px; display: inline-block; }
.bars { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: minmax(96px, 140px) minmax(0, 1fr) 52px; gap: 8px; align-items: center; font-size: 13px; cursor: default; }
.brow .tr { height: 12px; background: color-mix(in srgb, var(--ink) 8%, transparent); position: relative; }
.brow .fl { position: absolute; top: 0; bottom: 0; }
.brow .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); }
.brow .v { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* Stress lab */
.lab { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 32px; }
@media (max-width: 960px) { .lab { grid-template-columns: 1fr; } }
.ctl { background: var(--warm); padding: 22px; min-width: 0; align-self: start; }
.ctl h4, .res h4 { font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--bronze); margin: 18px 0 10px; }
.ctl h4:first-child, .res h4:first-child { margin-top: 0; }
.ctl select { width: 100%; font: inherit; font-size: 15px; font-weight: 500; background: var(--bg); color: var(--ink); border: 0; border-bottom: 1.5px solid var(--bronze); padding: 11px 10px; }
.sl { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 2px 10px; align-items: center; margin-bottom: 10px; }
.sl label { font-size: 13.5px; color: var(--ink-2); grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; }
.sl label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--bronze); }
.sl input[type="number"], .wt input { width: 72px; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--rule-strong); background: var(--bg); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.wt { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 6px 10px; align-items: center; font-size: 14px; }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.res { min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
.kpis > div { background: var(--warm); padding: 16px 18px; min-width: 0; }
.kpis .k { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--bronze); }
.kpis .v { font-family: var(--font-head); font-size: 40px; font-weight: 300; line-height: 1.1; }
.kpis .d { font-size: 13px; color: var(--ink-2); }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr; } }
.st { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; border-top: 2px solid var(--ink); }
.st th { text-align: right; font-size: 11.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 10px 8px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
.st th:first-child, .st td:first-child { text-align: left; }
.st td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.st tfoot td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: 0; }
.neg { color: var(--crit); } .pos { color: var(--good); }

/* Method */
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 44px; }
@media (max-width: 920px) { .two { grid-template-columns: 1fr; gap: 28px; } }
.answer { background: var(--hero); color: var(--on-dark); padding: 28px 30px; }
.answer h3 { color: var(--on-dark); font-size: 30px; margin: 0 0 10px; font-weight: 300; }
.answer p { color: var(--on-dark-2); margin: 0; font-size: 16px; max-width: 70ch; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }
.steps li { counter-increment: s; background: var(--warm); padding: 18px; border-top: 3px solid var(--bronze); }
.steps li::before { content: counter(s); font-family: var(--font-head); font-size: 34px; font-weight: 300; color: var(--bronze); display: block; line-height: 1; margin-bottom: 8px; }
.steps b { display: block; font-family: var(--font-head); font-size: 19px; font-weight: 500; margin-bottom: 4px; }
.steps span { font-size: 14px; color: var(--ink-2); }

footer { background: var(--hero); color: var(--on-dark-2); margin-top: 80px; }
footer .wrap { padding-block: 38px 46px; display: grid; gap: 14px; font-size: 13px; }
footer img { height: 40px; width: auto; max-width: 100%; display: block; }
footer p { margin: 0; max-width: 110ch; }
footer .docs { display: flex; flex-wrap: wrap; gap: 8px 20px; }
footer .docs a { color: var(--on-dark); }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--hero); color: var(--on-dark); font-size: 13px; padding: 8px 10px; max-width: 270px; line-height: 1.4; }
</style>
